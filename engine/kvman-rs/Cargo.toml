[package]
name = "g6kvman"
version = "0.1.0"
edition = "2021"
description = "gr8 S2 KV page allocator: every rank's pool of KV pages, the page list of each live and retained run"

[lib]
crate-type = ["rlib"]        # the C library is libg6host.a (engine/hostcore-rs)

[dependencies]
gr8-knobs = { path = "../knobs-rs" }

[features]
# every Pool starts with GR8_KV_SHARE_PAGES on (tests only: `cargo test --features share_default` runs the stock suite shared)
share_default = []
