[package]
name = "gr8-knobs"
version = "0.1.0"
edition = "2021"
description = "gr8 knobs: every setting the engine reads from the environment, typed, from one table"

[lib]
name = "gr8knobs"
# libgr8knobs.so for the launcher: cargo rustc --release --features capi --lib --crate-type cdylib. A cdylib here
# would drop the hash from every output file name, and a crate that builds twice (abort for binaries, unwind for
# tests under cargo test --release) would then overwrite its own outputs.
crate-type = ["staticlib", "rlib"]

[features]
# the C API (gr8_knob_*): on in exactly one Rust library of a binary, libgr8knobs.a for the engine
capi = []

[profile.release]
opt-level = 3
panic = "abort"        # a panic must not unwind into the C++ engine

[build-dependencies]
yaml-rust2 = "0.13.0"

[dev-dependencies]
yaml-rust2 = "0.13.0"
