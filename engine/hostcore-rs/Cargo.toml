[package]
name = "g6host"
version = "0.1.0"
edition = "2021"
description = "gr8's host Rust as one C library: the S2 page allocator (g6kvman.h) and the S2 scheduling logic (g6sched.h)"

[lib]
crate-type = ["staticlib"]
test = false
doctest = false

[dependencies]
g6kvman = { path = "../kvman-rs" }
g6sched = { path = "../scheduler-rs" }
