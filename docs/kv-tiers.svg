<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">gr8 KV tiers</title>
<desc id="d">Top: a live session's KV by token position. Below SHARE_LIMIT every rank holds every page; past it each rank holds every fourth page, on the GPU up to L and on the KV node past L. Bottom: when the pool lets a run go, system prompts go to the local SSD store and every other run to the KV node.</desc>
<style>
  :root { --bg:#ffffff; --fg:#1f2328; --muted:#59636e; --line:#d1d9e0; --rep:#4c8bf5; --cp:#2da44e; --empty:#eef1f4; --remote:#9a6700; --ssd:#8250df; --pool:#0969da; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --line:#3d444d; --rep:#4c8bf5; --cp:#3fb950; --empty:#21262d; --remote:#d29922; --ssd:#a371f7; --pool:#4c8bf5; }
  }
  .bg { fill: var(--bg); }
  .h { fill: var(--fg); font-size: 16px; font-weight: 600; }
  .t { fill: var(--fg); font-size: 13px; }
  .b { fill: var(--fg); font-size: 13px; font-weight: 600; }
  .s { fill: var(--muted); font-size: 12px; }
  .rep { fill: var(--rep); }
  .cp { fill: var(--cp); }
  .empty { fill: var(--empty); }
  .rule { stroke: var(--line); stroke-width: 1; }
  .mark { stroke: var(--fg); stroke-width: 1.5; stroke-dasharray: 4 3; }
  .rt { fill: var(--remote); }
  .remote { fill: none; stroke: var(--remote); stroke-width: 1.5; stroke-dasharray: 6 4; }
  .rtxt { fill: var(--remote); font-size: 13px; font-weight: 600; }
  .ssd { fill: none; stroke: var(--ssd); stroke-width: 2; }
  .ssdt { fill: var(--ssd); font-size: 13px; font-weight: 600; }
  .node { fill: none; stroke: var(--remote); stroke-width: 2; }
  .nodet { fill: var(--remote); font-size: 13px; font-weight: 600; }
  .pool { fill: none; stroke: var(--pool); stroke-width: 2; }
  .poolt { fill: var(--pool); font-size: 13px; font-weight: 600; }
  .arrow { stroke: var(--muted); stroke-width: 1.5; fill: none; marker-end: url(#ah); }
  .ahead { fill: var(--muted); }
</style>
