<line class="mark" x1="278" y1="58" x2="278" y2="172"/>
<text class="s" x="96" y="52">token 0</text>
<text class="b" x="278" y="52" text-anchor="middle">SHARE_LIMIT (R)</text>
<text class="s" x="636" y="52" text-anchor="end">context end →</text>
<rect class="remote" x="282" y="62" width="359" height="108" rx="6"/>
<rect class="rep" x="662" y="68" width="12" height="12" rx="2"/><text class="b" x="680" y="79">Replicated</text>
<text class="s" x="680" y="96">every rank holds every page</text>
<rect class="cp" x="662" y="112" width="12" height="12" rx="2"/><text class="b" x="680" y="123">CP-sharded</text>
<text class="s" x="680" y="140">rank r holds pages p mod 4 = r</text>
<rect class="remote" x="662" y="156" width="12" height="12" rx="2"/><text class="rtxt" x="680" y="167">KV node backed</text>
<text class="s" x="680" y="184">remote rows (in progress)</text>
<text class="b" x="24" y="202">Below R:</text>
<text class="s" x="120" y="202">every rank reads every page locally, and requests that fit share decode steps.</text>
<text class="b" x="24" y="221">Past R:</text>
<text class="s" x="120" y="221">each rank attends over its own pages; the top-2048 candidates merge across ranks.</text>
<text class="b" x="24" y="240">Remote rows:</text>
<text class="s" x="120" y="240">hot rows stay in a GPU resident pool; selected rows that are not resident are read over RDMA</text>
<text class="s" x="120" y="259">before attention, each rank only its own pages. Indexer keys and the MTP layer stay on the GPU.</text>
<line class="rule" x1="24" y1="286" x2="856" y2="286"/>
<text class="h" x="24" y="320">When the pool lets a run go</text>
<rect class="pool" x="24" y="342" width="230" height="104" rx="10"/>
<text class="poolt" x="38" y="368">GPU KV pool</text>
<text class="s" x="38" y="390">live sessions and retained runs;</text>
<text class="s" x="38" y="407">a request that continues a run</text>
<text class="s" x="38" y="424">reuses its pages</text>
<rect class="ssd" x="318" y="342" width="246" height="104" rx="10"/>
<text class="ssdt" x="332" y="368">Store 0: local SSD</text>
<text class="s" x="332" y="390">keep=system, persist=on</text>
<text class="s" x="332" y="407">system prompts and tools, once</text>
<text class="s" x="332" y="424">each; kept across restarts</text>
<rect class="node" x="636" y="342" width="220" height="104" rx="10"/>
<text class="nodet" x="650" y="368">Store 1: KV node RAM</text>
<text class="s" x="650" y="390">keep=all, over RDMA</text>
<text class="s" x="650" y="407">every other evicted run, with</text>
<text class="s" x="650" y="424">each rank's shard past R</text>
<path class="arrow" d="M258,388 L312,388"/>
<text class="s" x="286.0" y="380" text-anchor="middle">system</text>
<text class="s" x="286.0" y="404" text-anchor="middle">prefix</text>
<path class="arrow" d="M568,388 L630,388"/>
<text class="s" x="600.0" y="380" text-anchor="middle">full: oldest</text>
<text class="s" x="600.0" y="404" text-anchor="middle">move on</text>
<path class="arrow" d="M139.0,450 C139.0,492 746.0,492 746.0,452"/>
<text class="s" x="442.5" y="498" text-anchor="middle">any other run the pool evicts</text>
<text class="s" x="24" y="528">A request that continues a stored entry reads its pages back into the pool and skips their prefill. Stores are tried</text>
<text class="s" x="24" y="545">in order. A stored block is valid only for the R, rank count, block format and engine build that wrote it.</text>
</svg>
