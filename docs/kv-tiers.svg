<line class="mark" x1="278" y1="58" x2="278" y2="172"/>
<text class="s" x="96" y="52">token 0</text>
<text class="b" x="278" y="52" text-anchor="middle">SHARE_LIMIT (R)</text>
<line class="mark" x1="466" y1="58" x2="466" y2="172"/>
<text class="b" x="466" y="52" text-anchor="middle">L</text>
<text class="s" x="648" y="52" text-anchor="end">end →</text>
<rect class="rep" x="674" y="68" width="12" height="12" rx="2"/><text class="b" x="692" y="79">Replicated</text>
<text class="s" x="692" y="96">every rank holds every page</text>
<rect class="cp" x="674" y="112" width="12" height="12" rx="2"/><text class="b" x="692" y="123">CP-sharded</text>
<text class="s" x="692" y="140">rank r holds pages p mod 4 = r</text>
<rect class="rt" x="674" y="156" width="12" height="12" rx="2"/><text class="rtxt" x="692" y="167">CP-sharded, on KV node</text>
<text class="s" x="692" y="184">hot rows cached (in progress)</text>
<text class="b" x="24" y="202">Below R:</text>
<text class="s" x="120" y="202">every rank reads every page locally, and requests that fit share decode steps.</text>
<text class="b" x="24" y="221">Past R:</text>
<text class="s" x="120" y="221">each rank attends over its own pages; the top-2048 candidates merge across ranks.</text>
<text class="b" x="24" y="240">Past L:</text>
<text class="s" x="120" y="240">the same shards live on the KV node. Hot rows stay in a GPU resident pool; a selected row that is</text>
<text class="s" x="120" y="259">not resident is read over RDMA before attention. L defaults to R, drawn apart here for clarity.</text>
<text class="s" x="120" y="278">Indexer keys and the MTP layer stay on the GPU at every position.</text>
<line class="rule" x1="24" y1="305" x2="856" y2="305"/>
<text class="h" x="24" y="339">When the pool lets a run go</text>
<rect class="pool" x="24" y="361" width="230" height="104" rx="10"/>
<text class="poolt" x="38" y="387">GPU KV pool</text>
<text class="s" x="38" y="409">live sessions and retained runs;</text>
<text class="s" x="38" y="426">a request that continues a run</text>
<text class="s" x="38" y="443">reuses its pages</text>
<rect class="ssd" x="318" y="361" width="246" height="104" rx="10"/>
<text class="ssdt" x="332" y="387">Store 0: local SSD</text>
<text class="s" x="332" y="409">keep=system, persist=on</text>
<text class="s" x="332" y="426">system prompts and tools, once</text>
<text class="s" x="332" y="443">each; kept across restarts</text>
<rect class="node" x="636" y="361" width="220" height="104" rx="10"/>
<text class="nodet" x="650" y="387">Store 1: KV node RAM</text>
<text class="s" x="650" y="409">keep=all, over RDMA</text>
<text class="s" x="650" y="426">every other evicted run, with</text>
<text class="s" x="650" y="443">each rank's shard past R</text>
<path class="arrow" d="M258,407 L312,407"/>
<text class="s" x="286.0" y="399" text-anchor="middle">system</text>
<text class="s" x="286.0" y="423" text-anchor="middle">prefix</text>
<path class="arrow" d="M568,407 L630,407"/>
<text class="s" x="600.0" y="399" text-anchor="middle">full: oldest</text>
<text class="s" x="600.0" y="423" text-anchor="middle">move on</text>
<path class="arrow" d="M139.0,469 C139.0,511 746.0,511 746.0,471"/>
<text class="s" x="442.5" y="517" text-anchor="middle">any other run the pool evicts</text>
<text class="s" x="24" y="547">A request that continues a stored entry reads its pages back into the pool and skips their prefill. Stores are tried</text>
<text class="s" x="24" y="564">in order. A stored block is valid only for the R, rank count, block format and engine build that wrote it.</text>
</svg>
