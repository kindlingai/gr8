# Model descriptor, so a cluster can be planned without reading the launchers. Nothing reads it at run time except
# smoketest/run.sh, which takes the served name from it. Where it repeats a value (the KV pool), tools/launch/options.py
# and scripts/engine_args.sh are the ones that take effect, and CHANGELOG.md holds the measurement behind each number.
# The front end's first --served-model-name; it also answers to glm53.
name: glm-5.3
checkpoints:
  release: kindlingai/glm-5.3-exlr8-k2-k3-k4               # the whole model: routed experts at 2-4 bpw, dense and vocab files, tokenizer
  drafter: incoai/GLM-5.3-DFlash2                         # DFlash2 (TP=4), CC BY-NC-ND 4.0: --drafter fetches and converts it per box

description: >-
  Full GLM 5.3 (MoE with 256 routed experts, MLA attention with the sparse indexer, one MTP layer) on gr8, a
  from-scratch CUDA engine: one g6m4 process per GB10 box, RoCE v2 between them, an OpenAI-compatible front end on
  rank 0. TP=4 and TP=3 serve up to 8 requests at once (S2); TP=4 drafts with DFlash2 for a request that runs alone.

tp:
  default: 4
  measured: [3, 4, 6]

per_rank:
  tp4:
    variant: home               # 3.25 bpw routed experts
    weights_gb: 83              # the device image from the release (CHANGELOG 2026-10-10)
    s2_step_graphs_gib: 2.5     # SESS=8
    kv_pool_tokens: 393216      # CAP
    memavailable_after_boot_gib: 5.6-6.2   # S2 with DFlash2, 8 sessions
  tp3:
    variant: down1              # 2.25 bpw routed experts; home does not fit next to a KV pool
    weights_gb: 78.4
    kv_pool_tokens: 307200
    memavailable_after_boot_gib: 15.6-17
  tp6:
    variant: home
    kv_pool_tokens: 614400
  notes: >-
    One rank per box and nothing else holding much memory. CAP is the first thing to lower when a box runs short; a
    boot that would run a box out of memory stops while it allocates the KV pool.

api: openai
endpoints:
  - /v1/chat/completions
  - /v1/completions
  - /v1/models
  - /health
  - /tokenize
  - /metrics
port: 8100                      # PORT in config/cluster.env

# Smoketests live in smoketest/run.sh:  ./gr8 glm53 smoke, or smoketest/run.sh <base-url> [served-name]
