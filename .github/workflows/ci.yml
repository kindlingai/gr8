# CPU tests, the Rust binaries, the arm64 engine build, the tester zip and the container image, which goes to
# ghcr.io/kindlingai/gr8 from main and from tags.
#
# The Rust binaries (the loader and the front end) build on GitHub's hosted arm64 runner, for every pull request,
# forks included. The engine job runs on GR8_ARM_RUNNER (a repository variable, default ubuntu-24.04-arm). GR8_NATIVE=1
# (a repository variable) builds the engines on the runner itself, for a self-hosted runner with the CUDA 13 toolchain
# and no Docker daemon, linking the Rust job's loader. A pull request from a branch in this repository also builds the
# engines and the image. One from a fork runs the CPU tests and the Rust build only, so its code never runs on the
# self-hosted runner. The image job assembles the runtime image from the engine job's binaries on a hosted runner, and
# only it can write packages.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*', 'beta-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cpu:
    name: CPU tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Python packages
        run: python -m pip install numpy xxhash
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            engine/loader-rs/target
            frontend/g6front-rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Tests
        run: .github/ci/cpu-tests.sh

  rust:
    name: Rust binaries (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - name: Build the loader and the front end (Dockerfile target rust-dist)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          target: rust-dist
          platforms: linux/arm64
          outputs: type=local,dest=rust-dist
          cache-from: type=gha,scope=rust
          cache-to: type=gha,scope=rust,mode=max
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: rust-bin-arm64
          path: rust-dist/
          retention-days: 7
          if-no-files-found: error

  engine:
    name: Engine build (arm64, CUDA 13, sm_121a)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: rust
    runs-on: ${{ vars.GR8_ARM_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        if: vars.GR8_NATIVE == '1'
        with:
          name: rust-bin-arm64
          path: rust-dist
      - name: Build the binaries on the runner (GR8_NATIVE)
        if: vars.GR8_NATIVE == '1'
        # the Dockerfile's dist stage, without Docker: the TP=4, TP=6 and TP=3 engines, linking the Rust job's loader.
        # build.sh runs cargo whenever it finds it, which would rebuild the loader, so cargo is off the PATH here.
        run: |
          set -eux
          mkdir -p engine/loader-rs/target/release
          cp rust-dist/libg6load.a engine/loader-rs/target/release/
          install -m 755 rust-dist/g6load engine/loader-rs/target/release/
          PATH=$(printf %s "$PATH" | tr ':' '\n' | grep -v cargo | paste -sd: -)
          if command -v cargo; then echo "cargo is still on the PATH"; exit 1; fi
          mkdir -p build-front && install -m 755 rust-dist/g6front-rs build-front/
          G6_NR=4 scripts/build.sh "$PWD/build-tp4"
          scripts/build.sh "$PWD/build-tp6"
          G6_NR=3 scripts/build.sh "$PWD/build-tp3"
          mkdir -p dist/bin dist/bin6 dist/bin3
          cp build-tp4/g6m4 build-tp4/m4sim build-tp4/gpuprobe build-tp4/tr3_e4m3_test build-front/g6front-rs dist/bin/
          cp build-tp6/g6m4 build-tp6/m4sim build-tp6/gpuprobe build-tp6/tr3_e4m3_test dist/bin6/
          cp engine/loader-rs/target/release/g6load dist/bin/
          cp engine/loader-rs/target/release/g6load dist/bin6/
          cp build-tp3/g6m4 build-tp3/m4sim build-tp3/gpuprobe build-tp3/tr3_e4m3_test engine/loader-rs/target/release/g6load dist/bin3/
      - name: Free disk space
        if: vars.GR8_NATIVE != '1'
        # the CUDA devel image is about 10 GB unpacked
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: QEMU (x86 runner only)
        if: runner.arch != 'ARM64' && vars.GR8_NATIVE != '1'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3.7.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
        if: vars.GR8_NATIVE != '1'
      - name: Build the binaries (Dockerfile target dist)
        if: vars.GR8_NATIVE != '1'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          target: dist
          platforms: linux/arm64
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=gr8
          cache-to: type=gha,scope=gr8,mode=max
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: engine-bin-arm64
          path: dist/
          retention-days: 7
          if-no-files-found: error

  zip:
    name: Tester zip
    if: github.event_name != 'pull_request'
    needs: [cpu, engine]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: engine-bin-arm64
          path: dist
      - name: Assemble
        id: zip
        run: |
          python3 scripts/make_zip.py --bin dist --out out
          echo "name=gr8-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          { echo '### Tester zip'; echo; echo '```'; cat out/*.sha256; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ steps.zip.outputs.name }}
          path: |
            out/*.zip
            out/*.zip.sha256
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

  image:
    name: Container image (linux/arm64)
    # The runtime image around the engine job's binaries: the Dockerfile's dist stage is replaced by them (a named build
    # context), so nothing is compiled here. Pushed to ghcr.io from main and from tags, never from a pull request.
    needs: [cpu, engine]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      PUSH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: engine-bin-arm64
          path: ${{ runner.temp }}/dist
      - name: Restore the executable bits (artifacts drop them)
        run: find "$RUNNER_TEMP/dist" -type f ! -name '*.a' -exec chmod 755 {} +
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # latest and main follow main; a tag gets its own name; every image also gets sha-<commit>
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha
      - name: Build the runtime image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          target: runtime
          platforms: linux/arm64
          build-contexts: dist=${{ runner.temp }}/dist
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max
      - name: Smoke test (no GPU)
        run: |
          img=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker image ls "$img"
          docker run --rm --entrypoint bash "$img" -c '
            set -eu
            for b in bin/g6m4 bin/m4sim bin/gpuprobe bin/g6front-rs bin/g6load bin3/g6m4 bin6/g6m4 bin6/m4sim; do
              if ldd "$b" | grep "not found"; then echo "$b: missing libraries"; exit 1; fi
            done
            python3 -c "import g6s2shim, g6shim"
            python3 -c "import tools.convert.convert, tools.convert.dflash2"
            bin/g6front-rs --help > /dev/null
            echo smoke OK'
          docker run --rm "$img" show-config --peers 192.0.2.1,192.0.2.2,192.0.2.3,192.0.2.4 \
            --model https://huggingface.co/kindlingai/glm-5.3-exlr8-k2-k3-k4 --no-check > /dev/null
      - name: Push
        id: push
        if: env.PUSH == 'true'
        run: |
          for t in ${{ steps.meta.outputs.tags }}; do docker push "$t"; done
          echo "digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$(echo "${{ steps.meta.outputs.tags }}" | head -1)" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        if: env.PUSH == 'true'
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
