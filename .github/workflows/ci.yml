# CPU tests, the Rust binaries, the arm64 (sm_121a) and amd64 (sm_120a) engine builds, the tester zip and the
# multi-arch container image, which goes to ghcr.io/kindlingai/gr8 from main (called by release.yml via workflow_call)
# and from tagged releases.
#
# Every job runs on GitHub's hosted runners, on every push to a pull request, forks included (with a read-only token),
# on non-Markdown pushes to main via release.yml, on manual beta-* tag pushes, and on workflow_dispatch (with optional
# `tag` input to build/republish an existing v* tag). The rust and rust-amd64 jobs build rust-dist once per arch, and
# the engine / engine-amd64 jobs pass it to each leg via --build-context rust-dist, one leg per model/KV format, no GPU
# needed to compile. BuildKit layer caches live in a separate GHCR package (ghcr.io/<repo>-cache) so they do not exhaust
# GitHub's 10 GB Actions cache quota needed by Cargo and nvcc caches. The image and image-amd64 jobs assemble and smoke-
# test each platform's runtime image and push arch-specific tags on main/releases; image-manifest merges both digests
# into the multi-arch OCI manifest list (linux/arm64 sm_121a + linux/amd64 sm_120a), never from a pull request. Tagged
# v* releases also attach the tester zip, SHA-256, container digests, and build-provenance attestations to the GitHub Release.
#
# On a pull request the changes job picks the jobs from the files it changes (dorny/paths-filter, below): the
# front-end and engine halves of the CPU tests, the Rust binaries, and the engine builds with the image around them.
# Markdown files start nothing, so a PR that changes only them runs just changes, env-lint, zip-check and Finalize.
# Pushes to main, tags and manual runs always build everything: the image pushed from main is built from all of the tree.
#
# Finalize is the one check a PR needs from ci.yml to land: green when every job passed or skipped and the PR carries
# queue:ready (a maintainer's /ready, pr-ready.yml). A PR whose CI passes stays red there until /ready.
name: ci

on:
  pull_request:
  push:
    tags: ['beta-*']
  workflow_call:
    inputs:
      tag:
        description: "Optional vX.Y.Z tag just created by release-please"
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional existing vX.Y.Z or beta-* tag to build and publish (leave empty for current ref)"
        type: string
        default: ""

permissions:
  contents: read

# A new push to a pull request or to main cancels the older run. Releases, tags and manual runs each run in their own
# group and are never cancelled.
concurrency:
  group: ci-${{ inputs.tag || github.ref }}${{ !(github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && !inputs.tag)) && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && !inputs.tag) }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      cpu: ${{ github.event_name != 'pull_request' && '["frontend","engine"]' || steps.cpu.outputs.changes }}
      rust: ${{ github.event_name != 'pull_request' || steps.build.outputs.rust == 'true' }}
      engine: ${{ github.event_name != 'pull_request' || steps.build.outputs.engine == 'true' }}
      tag: ${{ steps.target.outputs.tag }}
      checkout_ref: ${{ steps.target.outputs.checkout_ref }}
      commit: ${{ steps.target.outputs.commit }}
      push: ${{ steps.target.outputs.push }}
      save_cache: ${{ steps.target.outputs.save_cache }}
    steps:
      - name: Resolve build target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          checkout_ref=""
          commit="$GITHUB_SHA"
          if [ -n "$tag" ]; then
            if ! [[ "$tag" =~ ^(v[0-9]+(\.[0-9]+){1,2}(-[0-9A-Za-z.-]+)?|beta-[0-9A-Za-z._-]+)$ ]]; then
              echo "::error::tag must match vX.Y[.Z] (optional -prerelease) or beta-*, got: $tag"
              exit 1
            fi
            # Confirm refs/tags/$tag exists as an exact tag ref, then dereference (handles annotated tags).
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
              | jq -e --arg ref "refs/tags/$tag" 'type == "object" and .ref == $ref' >/dev/null
            commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$tag" --jq .sha)
            checkout_ref="$commit"
          elif [ "$EVENT_NAME" = "push" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          fi
          push=false
          if [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "workflow_call" ] \
             || { [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$tag" ]; }; then
            push=true
          fi
          save_cache=false
          if { [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "workflow_call" ]; } \
             && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            save_cache=true
          fi
          {
            echo "tag=$tag"
            echo "checkout_ref=$checkout_ref"
            echo "commit=$commit"
            echo "push=$push"
            echo "save_cache=$save_cache"
          } >> "$GITHUB_OUTPUT"
      # A pull request's files come from the API, so nothing is checked out. A filter matches a file that matches one
      # of its paths and is not Markdown. Every filter lists ci.yml, so a change to this file runs everything.
      - name: The CPU tests' halves (cpu-tests.sh)
        id: cpu
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            # the front end, the shim, the launcher and the pseudo engine. Their tests compile the engine's S2 and
            # steering headers and build g6load/knobs/hostcore, and the launcher imports tools/steering.
            # Kernel/attention/engram/kda/mhc-only engine edits do not affect frontend or macOS tests.
            frontend:
              - '!**/*.md'
              - '.github/workflows/ci.yml'
              - '.github/ci/**'
              - 'frontend/**'
              - 'tools/launch/**'
              - 'tools/switch/**'
              - 'config/switch.env.example'
              - 'tools/steering/**'
              - 'smoketest/**'
              - 'gr8'
              - 'knobs/**'
              - 'scripts/engine_args.sh'
              - 'engine/Cargo.toml'
              - 'engine/Cargo.lock'
              - 'engine/rust-toolchain.toml'
              - 'engine/hostcore-rs/**'
              - 'engine/kvman-rs/**'
              - 'engine/scheduler-rs/**'
              - 'engine/knobs-rs/**'
              - 'engine/loader/**'
              - 'engine/loader-rs/**'
              - 'engine/runtime/s2/**'
              - 'engine/runtime/steering*'
              - 'engine/runtime/tests/steering_*'
              - 'engine/module_info.h'
              - 'engine/g6mx.h'
              - 'engine/g6nr.h'
              - 'engine/model_geom*.h'
            # the host tests, the tools' and the bench's tests, the compose file, the Helm chart and the engine's
            # Rust crates; bash -n of the recipes' scripts
            engine:
              - '!**/*.md'
              - '.github/workflows/ci.yml'
              - '.github/ci/**'
              - 'engine/**'
              - 'knobs/**'
              - 'scripts/**'
              - 'tools/steering/**'
              - 'tools/convert/**'
              - 'tools/health/**'
              - 'tools/ngram/**'
              - 'tools/query/**'
              - 'tools/*.py'
              - 'bench/**'
              - 'docker/**'
              - 'deploy/**'
      - name: The builds
        id: build
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            # the Dockerfile's rust-dist: the loader, the page allocator, the scheduling logic and the front end
            rust:
              - '!**/*.md'
              - '.github/workflows/ci.yml'
              - 'Dockerfile'
              - '.dockerignore'
              - 'engine/Cargo.toml'
              - 'engine/Cargo.lock'
              - 'engine/hostcore-rs/**'
              - 'engine/loader-rs/**'
              - 'engine/kvman-rs/**'
              - 'engine/knobs-rs/**'
              - 'engine/scheduler-rs/**'
              - 'knobs/**'
              - 'frontend/g6front-rs/**'
            # the engine builds and the image: what the Dockerfile's engine stages copy (the front end's Cargo files
            # pin the XGrammar sources the engine compiles), and the entrypoint the image's smoke test runs
            engine:
              - '!**/*.md'
              - '.github/workflows/ci.yml'
              - 'Dockerfile'
              - '.dockerignore'
              - 'engine/**'
              - 'knobs/**'
              - 'scripts/build.sh'
              - 'scripts/ds41_build_flags.sh'
              - 'tools/health/gpuprobe.cu'
              - 'frontend/g6front-rs/Cargo.toml'
              - 'frontend/g6front-rs/Cargo.lock'
              - 'frontend/g6front-rs/rust-toolchain.toml'
              - 'docker/entrypoint.sh'

  cpu:
    name: CPU tests (${{ matrix.part }})
    needs: changes
    if: needs.changes.outputs.cpu != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Faster CI test builds without touching production Dockerfile release settings:
      # skip fat LTO when building g6front-rs for smoke/API tests, optimize cargo test loops (kvman-rs traces),
      # disable incremental blobs (keeps target/ caches ~60% smaller), and skip duplicate env_lint.py (env-lint runs it).
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_OPT_LEVEL: "2"
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
      HOST_TESTS_SKIP_ENV_LINT: "1"
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.changes.outputs.cpu) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ needs.changes.outputs.checkout_ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Python packages
        run: python -m pip install numpy xxhash pyyaml
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            engine/target
            engine/loader-rs/target
            engine/knobs-rs/target
            frontend/g6front-rs/target
            frontend/pseudo-engine/target
          key: cargo-v2-${{ matrix.part }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/rust-toolchain.toml') }}
          restore-keys: cargo-v2-${{ matrix.part }}-${{ runner.os }}-
      - name: Tokenizer for the pseudo engine's tests
        if: matrix.part == 'frontend'
        run: |
          .github/ci/fetch-tokenizer.sh "$RUNNER_TEMP/tokenizer"
          echo "GR8_PSEUDO_TOKENIZER=$RUNNER_TEMP/tokenizer" >> "$GITHUB_ENV"
      - name: Tests
        run: .github/ci/cpu-tests.sh ${{ matrix.part }}

  cpu-macos:
    name: CPU tests (frontend, macOS)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.cpu), 'frontend')
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_OPT_LEVEL: "2"
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ needs.changes.outputs.checkout_ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Python packages
        run: python -m pip install numpy xxhash pyyaml
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            engine/target
            engine/loader-rs/target
            engine/knobs-rs/target
            frontend/g6front-rs/target
            frontend/pseudo-engine/target
          key: cargo-v2-frontend-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/rust-toolchain.toml') }}
          restore-keys: cargo-v2-frontend-${{ runner.os }}-
      - name: Tokenizer for the pseudo engine's tests
        run: |
          .github/ci/fetch-tokenizer.sh "$RUNNER_TEMP/tokenizer"
          echo "GR8_PSEUDO_TOKENIZER=$RUNNER_TEMP/tokenizer" >> "$GITHUB_ENV"
      - name: The loopback addresses the launch end to end test uses
        run: |
          for a in 127.0.0.{2,3,4} 127.0.{1,2}.{1,2,3,4}; do sudo ifconfig lo0 alias "$a" up; done
          printf '127.0.0.2 localhost\n127.0.0.3 localhost\n127.0.0.4 localhost\n' | sudo tee -a /etc/hosts > /dev/null
      - name: Tests
        run: .github/ci/cpu-tests.sh frontend

  rust:
    name: Rust binaries (arm64)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ needs.changes.outputs.checkout_ref }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache repository
        id: cache
        run: echo "repo=$(echo "ghcr.io/${GITHUB_REPOSITORY}-cache" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Build the loader, host libs, knobs and front end (Dockerfile target rust-dist)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          target: rust-dist
          platforms: linux/arm64
          outputs: type=local,dest=rust-dist
          # Read BuildKit layer cache from the GHCR cache package; write only on main.
          cache-from: type=registry,ref=${{ steps.cache.outputs.repo }}:rust
          cache-to: ${{ needs.changes.outputs.save_cache == 'true' && format('type=registry,ref={0}:rust,mode=max', steps.cache.outputs.repo) || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: rust-bin-arm64
          path: rust-dist/
          retention-days: 7
          if-no-files-found: error

  rust-amd64:
    name: Rust binaries (amd64)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ needs.changes.outputs.checkout_ref }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache repository
        id: cache
        run: echo "repo=$(echo "ghcr.io/${GITHUB_REPOSITORY}-cache" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Build the loader, host libs, knobs and front end (Dockerfile target rust-dist)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          target: rust-dist
          platforms: linux/amd64
          outputs: type=local,dest=rust-dist
          cache-from: type=registry,ref=${{ steps.cache.outputs.repo }}:rust-amd64
          cache-to: ${{ needs.changes.outputs.save_cache == 'true' && format('type=registry,ref={0}:rust-amd64,mode=max', steps.cache.outputs.repo) || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: rust-bin-amd64
          path: rust-dist/
          retention-days: 7
          if-no-files-found: error

  engine:
    # The parts (GLM fp8 KV, GLM int4 KV, Flash, Flash int4 KV, DeepSeek-V4.1-Flash, Inkling-2-Small, Qwen3.8-Flash-Next,
    # and the two test binaries the image ships) share no CUDA compilation, so they get a runner each. All legs consume
    # rust-dist built once by the rust job via --build-context rust-dist, so Rust crates are never compiled redundantly
    # across runners. engine-tests runs these steps for the other test binaries, which the image does not wait for.
    name: Engine build (${{ matrix.label }}, arm64, CUDA 13, sm_121a)
    needs: [changes, rust]
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      # the compile cache is saved by main only, as the layer cache is
      NVCC_SAVE: ${{ needs.changes.outputs.save_cache }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every leg shares the stages before its compile (toolchain, xgrammar, engine-src). The fp8 leg exports them
          # under tag gr8 in ghcr.io/<repo>-cache and every leg reads it. Each leg also exports its own tag, so a PR
          # that leaves a leg's inputs alone reuses its compile layer.
          - leg: fp8
            label: fp8 KV
            target: dist-fp8
            scope: gr8
          - leg: int4
            label: int4 KV
            target: dist-int4
            scope: gr8-int4
          - leg: flash
            label: Flash
            target: dist-flash
            scope: gr8-flash
          - leg: flash-int4
            label: Flash int4 KV
            target: dist-flash-int4
            scope: gr8-flash-int4
          - leg: ds41
            label: DeepSeek-V4.1-Flash
            target: dist-ds41
            scope: gr8-ds41
          - leg: ink2
            label: Inkling-2-Small
            target: dist-ink2
            scope: gr8-ink2
          - leg: qw38
            label: Qwen3.8-Flash-Next
            target: dist-qw38
            scope: gr8-qw38
          - leg: hy4
            label: Hy4-flash
            target: dist-hy4
            scope: gr8-hy4
          - leg: tests-ship
            label: shipped tests
            target: dist-tests
            scope: gr8-tests-ship
    steps: &engine-steps
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ needs.changes.outputs.checkout_ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: rust-bin-arm64
          path: ${{ runner.temp }}/rust-dist
      - name: Free disk space
        # the CUDA devel image is about 10 GB unpacked
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The compile cache (docs/BUILD-CACHE.md): the leg's cache mount (gr8-nvcc-<leg>, Dockerfile), kept in the Actions
      # cache between runs. The double-dash delimiter prevents `flash--` from prefix-matching `flash-int4--`.
      - name: The compile cache's key
        id: nvcc
        run: |
          echo "key=gr8-nvcc-${{ matrix.leg }}--${{ hashFiles('Dockerfile', 'engine/**', 'knobs/**', 'scripts/build.sh', 'scripts/ds41_build_flags.sh', 'tools/health/gpuprobe.cu', 'frontend/g6front-rs/Cargo.lock') }}" >> "$GITHUB_OUTPUT"
          repo=$(echo "ghcr.io/${GITHUB_REPOSITORY}-cache" | tr '[:upper:]' '[:lower:]')
          echo "cache_repo=$repo" >> "$GITHUB_OUTPUT"
          {
            echo "cache_from<<EOF"
            echo "type=registry,ref=${repo}:gr8"
            if [ "${{ matrix.scope }}" != "gr8" ]; then
              echo "type=registry,ref=${repo}:${{ matrix.scope }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Restore the compile cache, and save it after the build
        id: nvcc-save
        if: env.NVCC_SAVE == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ${{ runner.temp }}/nvcc-cache
          key: ${{ steps.nvcc.outputs.key }}
          restore-keys: gr8-nvcc-${{ matrix.leg }}--
      - name: Restore the compile cache
        if: env.NVCC_SAVE != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ${{ runner.temp }}/nvcc-cache
          key: ${{ steps.nvcc.outputs.key }}
          restore-keys: gr8-nvcc-${{ matrix.leg }}--
      - name: Put the compile cache in the builder's cache mount
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723  # v3.4.0
        with:
          cache-map: '{"${{ runner.temp }}/nvcc-cache": {"target": "/var/cache/gr8-nvcc", "id": "gr8-nvcc-${{ matrix.leg }}-arm64"}}'
          scratch-dir: ${{ runner.temp }}/nvcc-dance
          # copy it back out only to save it: on main, when no copy has this key yet
          skip-extraction: ${{ env.NVCC_SAVE != 'true' || steps.nvcc-save.outputs.cache-hit == 'true' }}
      - name: Widths
        # On pull requests, compile the distinct-code widths: GLM fp8/int4/tests compile 1 4 8 (single-rank, PF_F12
        # fat-CTA width 4, and the largest); Flash and Flash-int4 compile 1 4 (single-rank and TP4 #if G6_NR == 4).
        # main and tags compile every width, so a width-specific break still fails before a release.
        id: w
        run: |
          widths=''
          if [ "${{ github.event_name }}" = pull_request ]; then
            case "${{ matrix.leg }}" in
              flash|flash-int4) widths='1 4' ;;
              qw38|hy4)         widths='1 2' ;;
              fp8|int4|tests)   widths='1 4 8' ;;
            esac
          fi
          echo "widths=$widths" >> "$GITHUB_OUTPUT"
          case "${{ matrix.leg }}" in
            flash)      echo "Flash, TP widths ${widths:-1 2 3 4}" ;;
            flash-int4) echo "Flash int4 KV, TP widths ${widths:-1 2 3 4}" ;;
            ds41)       echo "DeepSeek-V4.1-Flash, TP width 4" ;;
            ink2)       echo "Inkling-2-Small, TP widths ${widths:-1 4 6}" ;;
            qw38)       echo "Qwen3.8-Flash-Next, TP widths ${widths:-1 2 3 4}" ;;
            hy4)        echo "Hy4-flash, TP widths ${widths:-1 2}" ;;
            tests)      echo "test binaries, dtr_test at TP4, ptab widths ${widths:-1 2 3 4 5 6 8}" ;;
            tests-ship) echo "the shipped test binaries: tr3_e4m3_test and gpuprobe" ;;
            *)          echo "${{ matrix.label }}, TP widths ${widths:-1 2 3 4 5 6 8}" ;;
          esac >> "$GITHUB_STEP_SUMMARY"
      - name: Build the binaries (Dockerfile target ${{ matrix.target }})
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/arm64
          build-contexts: rust-dist=${{ runner.temp }}/rust-dist
          build-args: |
            GR8_WIDTHS=${{ steps.w.outputs.widths }}
          # a dist-* target exports its binaries; engine-tests only checks that the test binaries compile
          outputs: ${{ startsWith(matrix.target, 'dist-') && 'type=local,dest=dist' || 'type=cacheonly' }}
          cache-from: ${{ steps.nvcc.outputs.cache_from }}
          cache-to: ${{ needs.changes.outputs.save_cache == 'true' && format('type=registry,ref={0}:{1},mode=max', steps.nvcc.outputs.cache_repo, matrix.scope) || '' }}
      - if: startsWith(matrix.target, 'dist-')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: engine-bin-arm64-${{ matrix.leg }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # every test binary build.sh makes (GR8_TESTS=only), with the engine job's steps: a compile check on its own runner.
  # The image ships none of them (the tests-ship leg builds the two it does), so a PR's image does not wait for it.
  engine-tests:
    name: Engine build (${{ matrix.label }}, arm64, CUDA 13, sm_121a)
    needs: [changes, rust]
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      NVCC_SAVE: ${{ needs.changes.outputs.save_cache }}
    strategy:
      matrix:
        include:
          - leg: tests
            label: tests
            target: engine-tests
            scope: gr8-tests
    steps: *engine-steps

  # linux/amd64 sm_120a (RTX 5090 / RTX PRO 6000) engine legs: Qwen3.8-Flash-Next (including single-GPU Strata + AVX-512
  # K3 CPU MoE mode), Inkling-2-Small/Mini, and the shipped GPU health/unit tests. Kept lean so amd64 nvcc caches do not
  # crowd the 10 GB Actions cache quota used by the 8-leg arm64 GB10 build; Dockerfile supports all targets on amd64.
  engine-amd64:
    name: Engine build (${{ matrix.label }}, amd64, CUDA 13, sm_120a)
    needs: [changes, rust-amd64]
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      NVCC_SAVE: ${{ needs.changes.outputs.save_cache }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: qw38
            label: Qwen3.8-Flash-Next
            target: dist-qw38
            scope: gr8-amd64-qw38
          - leg: ink2
            label: Inkling-2-Small
            target: dist-ink2
            scope: gr8-amd64-ink2
          - leg: hy4
            label: Hy4-flash
            target: dist-hy4
            scope: gr8-amd64-hy4
          - leg: tests-ship
            label: shipped tests
            target: dist-tests
            scope: gr8-amd64-tests-ship
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ needs.changes.outputs.checkout_ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: rust-bin-amd64
          path: ${{ runner.temp }}/rust-dist
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The compile cache's key
        id: nvcc
        run: |
          echo "key=gr8-nvcc-amd64-${{ matrix.leg }}--${{ hashFiles('Dockerfile', 'engine/**', 'knobs/**', 'scripts/build.sh', 'scripts/ds41_build_flags.sh', 'tools/health/gpuprobe.cu', 'frontend/g6front-rs/Cargo.lock') }}" >> "$GITHUB_OUTPUT"
          repo=$(echo "ghcr.io/${GITHUB_REPOSITORY}-cache" | tr '[:upper:]' '[:lower:]')
          echo "cache_repo=$repo" >> "$GITHUB_OUTPUT"
          {
            echo "cache_from<<EOF"
            echo "type=registry,ref=${repo}:gr8-amd64-qw38"
            if [ "${{ matrix.scope }}" != "gr8-amd64-qw38" ]; then
              echo "type=registry,ref=${repo}:${{ matrix.scope }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Restore the compile cache, and save it after the build
        id: nvcc-save
        if: env.NVCC_SAVE == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ${{ runner.temp }}/nvcc-cache
          key: ${{ steps.nvcc.outputs.key }}
          restore-keys: gr8-nvcc-amd64-${{ matrix.leg }}--
      - name: Restore the compile cache
        if: env.NVCC_SAVE != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ${{ runner.temp }}/nvcc-cache
          key: ${{ steps.nvcc.outputs.key }}
          restore-keys: gr8-nvcc-amd64-${{ matrix.leg }}--
      - name: Put the compile cache in the builder's cache mount
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723  # v3.4.0
        with:
          cache-map: '{"${{ runner.temp }}/nvcc-cache": {"target": "/var/cache/gr8-nvcc", "id": "gr8-nvcc-${{ matrix.leg }}-amd64"}}'
          scratch-dir: ${{ runner.temp }}/nvcc-dance
          skip-extraction: ${{ env.NVCC_SAVE != 'true' || steps.nvcc-save.outputs.cache-hit == 'true' }}
      - name: Widths
        id: w
        run: |
          widths=''
          if [ "${{ github.event_name }}" = pull_request ]; then
            case "${{ matrix.leg }}" in
              qw38) widths='1 2' ;;
              hy4)  widths='1' ;;
            esac
          fi
          echo "widths=$widths" >> "$GITHUB_OUTPUT"
          case "${{ matrix.leg }}" in
            ink2)       echo "Inkling-2-Small (amd64, sm_120a), TP widths ${widths:-1 4 6}" ;;
            qw38)       echo "Qwen3.8-Flash-Next (amd64, sm_120a), TP widths ${widths:-1 2 3 4}" ;;
            hy4)        echo "Hy4-flash (amd64, sm_120a), TP widths ${widths:-1 2}" ;;
            tests-ship) echo "the shipped test binaries (amd64, sm_120a): tr3_e4m3_test and gpuprobe" ;;
          esac >> "$GITHUB_STEP_SUMMARY"
      - name: Build the binaries (Dockerfile target ${{ matrix.target }})
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          build-contexts: rust-dist=${{ runner.temp }}/rust-dist
          build-args: |
            CUDA_ARCH=120a
            GR8_WIDTHS=${{ steps.w.outputs.widths }}
          outputs: type=local,dest=dist
          cache-from: ${{ steps.nvcc.outputs.cache_from }}
          cache-to: ${{ needs.changes.outputs.save_cache == 'true' && format('type=registry,ref={0}:{1},mode=max', steps.nvcc.outputs.cache_repo, matrix.scope) || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: engine-bin-amd64-${{ matrix.leg }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # every environment read goes through the knob table (engine/knobs-rs): no bare getenv or std::env::var, every knob
  # read somewhere, the launcher's and recipes' values accepted, the generated header and docs/ENV.md current. On every
  # run, Markdown-only ones too, since docs/ENV.md is generated
  env-lint:
    name: Environment reads (knob table)
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ needs.changes.outputs.checkout_ref }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/knobs-rs/target
          key: cargo-knobs-lint-${{ runner.os }}-${{ hashFiles('engine/knobs-rs/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-knobs-lint-${{ runner.os }}-
      - run: python3 tools/env_lint.py

  # make_zip.py's tree checks (every top-level entry shipped or skipped, no symlinks), which the zip job runs only on
  # main and tags, so a PR that adds a top-level entry fails here instead of after it lands. A few seconds.
  zip-check:
    name: Tester zip (tree check)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - run: python3 scripts/make_zip.py --check

  zip:
    name: Tester zip
    if: github.event_name != 'pull_request'
    needs: [changes, cpu, rust, engine]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact_name: ${{ steps.zip.outputs.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ needs.changes.outputs.checkout_ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: rust-bin-arm64
          path: rust-dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: engine-bin-arm64-*
          merge-multiple: true
          path: dist
      - name: Merge rust-dist binaries into dist/bin
        run: mkdir -p dist/bin && cp -a rust-dist/bin/. dist/bin/
      - name: Assemble
        id: zip
        run: |
          python3 scripts/make_zip.py --bin dist --out out
          echo "name=gr8-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          { echo '### Tester zip'; echo; echo '```'; cat out/*.sha256; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ steps.zip.outputs.name }}
          path: |
            out/*.zip
            out/*.zip.sha256
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

  image:
    name: Container image (linux/arm64, push)
    # The arm64 runtime image around the rust and engine jobs' binaries: the Dockerfile's dist stage is replaced by them
    # (a named build context), so nothing is compiled here. This job pushes the arch-specific sha-<commit>-arm64 tag on
    # main (via release.yml), tagged releases, and manual tag dispatches only after the CPU tests and engine-tests pass;
    # image-manifest then merges it with image-amd64 into the multi-arch manifest list. image-pr runs the same steps for
    # pull requests and untagged manual runs, which never push.
    needs: [changes, cpu, rust, engine, engine-tests]
    if: ${{ needs.changes.outputs.push == 'true' && !cancelled() && needs.engine.result == 'success' && needs.engine-tests.result == 'success' && needs.rust.result == 'success' && needs.cpu.result != 'failure' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      PUSH: 'true'
    steps: &image-steps
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ needs.changes.outputs.checkout_ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: rust-bin-arm64
          path: ${{ runner.temp }}/rust-dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: engine-bin-arm64-*
          merge-multiple: true
          path: ${{ runner.temp }}/dist
      - name: Merge rust-dist binaries and restore executable bits (artifacts drop them)
        run: |
          mkdir -p "$RUNNER_TEMP/dist/bin"
          cp -a "$RUNNER_TEMP/rust-dist/bin/." "$RUNNER_TEMP/dist/bin/"
          find "$RUNNER_TEMP/dist" -type f ! -name '*.a' -exec chmod 755 {} +
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: info
        run: |
          short_sha=$(git rev-parse --short=7 HEAD)
          {
            echo "short_sha=$short_sha"
            echo "cache_repo=$(echo "ghcr.io/${GITHUB_REPOSITORY}-cache" | tr '[:upper:]' '[:lower:]')"
          } >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=sha-${{ steps.info.outputs.short_sha }}-arm64
      - name: Build the runtime image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          target: runtime
          platforms: linux/arm64
          build-contexts: dist=${{ runner.temp }}/dist
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          cache-from: type=registry,ref=${{ steps.info.outputs.cache_repo }}:runtime
          cache-to: ${{ needs.changes.outputs.save_cache == 'true' && format('type=registry,ref={0}:runtime,mode=max', steps.info.outputs.cache_repo) || '' }}
      - name: Smoke test (no GPU)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          img=$(echo "$TAGS" | head -1)
          docker image ls "$img"
          docker run --rm --entrypoint bash "$img" -c '
            set -eu
            binaries=$(python3 tools/launch/models.py get image-binaries)
            test -n "$binaries"
            for b in $binaries; do
              [ -x "$b" ] || { echo "$b: not in the image"; exit 1; }
              if ldd "$b" | grep "not found"; then echo "$b: missing libraries"; exit 1; fi
            done
            python3 -c "import g6s2shim"
            PYTHONPATH=tools/launch python3 -c "import supervisor, steering_hf; from steering import release"
            python3 tools/steering/release.py --help > /dev/null
            python3 tools/steering/evaluate.py --help > /dev/null
            python3 tools/steering/trace_audit.py --help > /dev/null
            bin/g6front-rs --help > /dev/null
            bin/g6front-rs engram-cmap --help > /dev/null
            bin/g6m4_ds41 --rank 0 --ips a,b,c,d --image --layers all --v2-dense m --mtp 0 --check-args 2>&1 | grep -qF "TP4, 48 rows a step"
            echo smoke OK'
          # Every registered GPU model and supported TP must pass the entrypoint's config smoke.
          configs=$(docker run --rm --entrypoint python3 "$img" -c 'from tools.launch.models import SERVED; [print(m.name, tp, m.release) for m in SERVED for tp in m.tp]')
          test -n "$configs"
          while read -r model tp release; do
            peers=$(python3 -c 'import sys; print(",".join("192.0.2." + str(i+1) for i in range(int(sys.argv[1]))))' "$tp")
            docker run --rm -e GR8_MODEL="$model" "$img" show-config --tp "$tp" --peers "$peers" \
              --model "$release" --no-check > /dev/null
          done <<< "$configs"
          # no model stops in the entrypoint, with exit 2 and the line to add: nothing picks one
          rc=0; err=$(docker run --rm "$img" 2>&1 >/dev/null) || rc=$?
          echo "$err"
          [ "$rc" = 2 ] && echo "$err" | grep -q 'GR8_MODEL=glm53f' || { echo "model check: exit $rc"; exit 1; }
          # up with a limited memlock stops in the entrypoint, with exit 2 and the setting to change
          rc=0; err=$(docker run --rm -e GR8_MODEL=glm53 --ulimit memlock=65536:65536 "$img" 2>&1 >/dev/null) || rc=$?
          echo "$err"
          [ "$rc" = 2 ] && echo "$err" | grep -q 'memlock=-1' || { echo "memlock check: exit $rc"; exit 1; }
      - name: Push
        id: push
        if: env.PUSH == 'true'
        # the tags are one per line: through env, not pasted into the script
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for t in $TAGS; do docker push "$t"; done
          echo "digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$(echo "$TAGS" | head -1)" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        if: env.PUSH == 'true' && github.event.repository.visibility == 'public'
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # image's steps on pull requests and untagged manual runs, which push nothing: it starts once the shipped binaries are
  # built instead of also waiting for the CPU tests and engine-tests, which finish minutes after them. Finalize still
  # needs all of them to pass.
  image-pr:
    name: Container image (linux/arm64)
    needs: [changes, rust, engine]
    if: ${{ needs.changes.outputs.push != 'true' && !cancelled() && needs.engine.result == 'success' && needs.rust.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      PUSH: false
    steps: *image-steps

  image-amd64:
    name: Container image (linux/amd64, push)
    # The amd64 (sm_120a) runtime image around rust-amd64 and engine-amd64. Pushes sha-<commit>-amd64 on main/tags so
    # image-manifest can combine it with the arm64 image into the multi-arch manifest list.
    needs: [changes, cpu, rust-amd64, engine-amd64]
    if: ${{ needs.changes.outputs.push == 'true' && !cancelled() && needs.engine-amd64.result == 'success' && needs.rust-amd64.result == 'success' && needs.cpu.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      PUSH: 'true'
    steps: &image-amd64-steps
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ needs.changes.outputs.checkout_ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: rust-bin-amd64
          path: ${{ runner.temp }}/rust-dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: engine-bin-amd64-*
          merge-multiple: true
          path: ${{ runner.temp }}/dist
      - name: Merge rust-dist binaries and restore executable bits (artifacts drop them)
        run: |
          mkdir -p "$RUNNER_TEMP/dist/bin"
          cp -a "$RUNNER_TEMP/rust-dist/bin/." "$RUNNER_TEMP/dist/bin/"
          find "$RUNNER_TEMP/dist" -type f ! -name '*.a' -exec chmod 755 {} +
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: info
        run: |
          short_sha=$(git rev-parse --short=7 HEAD)
          {
            echo "short_sha=$short_sha"
            echo "cache_repo=$(echo "ghcr.io/${GITHUB_REPOSITORY}-cache" | tr '[:upper:]' '[:lower:]')"
          } >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=sha-${{ steps.info.outputs.short_sha }}-amd64
      - name: Build the runtime image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          build-contexts: dist=${{ runner.temp }}/dist
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          cache-from: type=registry,ref=${{ steps.info.outputs.cache_repo }}:runtime-amd64
          cache-to: ${{ needs.changes.outputs.save_cache == 'true' && format('type=registry,ref={0}:runtime-amd64,mode=max', steps.info.outputs.cache_repo) || '' }}
      - name: Smoke test (no GPU)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          img=$(echo "$TAGS" | head -1)
          docker image ls "$img"
          docker run --rm --entrypoint bash "$img" -c '
            set -eu
            [ "$(uname -m)" = x86_64 ] || { echo "expected x86_64 container, got $(uname -m)"; exit 1; }
            for b in bin/g6m4_qw38 bin/m4sim_qw38 bin/g6m4_ink2 bin/m4sim_ink2 bin/g6m4_hy4 bin/m4sim_hy4 bin/gpuprobe bin/tr3_e4m3_test \
                     bin/g6front-rs bin/g6load bin/g6layout bin/kvman-remote bin/kvman-peer; do
              [ -x "$b" ] || { echo "$b: not in the image"; exit 1; }
              if ldd "$b" | grep "not found"; then echo "$b: missing libraries"; exit 1; fi
            done
            [ -f bin/lib/libgr8knobs.so ] || { echo "bin/lib/libgr8knobs.so: not in the image"; exit 1; }
            # Verify TP=1 support on both RTX 5090 targets and PR #610 Strata AVX-512 K3 CPU MoE build in g6m4_qw38.
            bin/g6m4_qw38 --rank 0 --ips 127.0.0.1 --manifest m --pack p --top-p-cands 99999 2>&1 \
              | grep -qF -- "--top-p-cands must be 0..2048" || { echo "g6m4_qw38 does not run TP=1"; exit 1; }
            bin/g6m4_ink2 --rank 0 --ips 127.0.0.1 --manifest m --pack p --top-p-cands 99999 2>&1 \
              | grep -qF -- "--top-p-cands must be 0..2048" || { echo "g6m4_ink2 does not run TP=1"; exit 1; }
            bin/g6m4_hy4 --rank 0 --ips 127.0.0.1 --manifest m --pack p --top-p-cands 99999 2>&1 \
              | grep -qF -- "--top-p-cands must be 0..2048" || { echo "g6m4_hy4 does not run TP=1"; exit 1; }
            grep -a -qF "qw38 strata CPU hybrid K3 MoE" bin/g6m4_qw38 \
              || { echo "g6m4_qw38 missing Strata AVX-512 CPU MoE support"; exit 1; }
            python3 -c "import g6s2shim"
            PYTHONPATH=tools/launch python3 -c "import supervisor, steering_hf; from steering import release"
            python3 tools/steering/release.py --help > /dev/null
            python3 tools/steering/evaluate.py --help > /dev/null
            python3 tools/steering/trace_audit.py --help > /dev/null
            bin/g6front-rs --help > /dev/null
            echo smoke OK'
          # Verify qw38 single-GPU Strata mode and every supported qw38 / ink2 TP pass the entrypoint config smoke.
          docker run --rm -e GR8_MODEL=qw38 -e CAP=40960 -e SESS=1 -e MTP=4 -e REUSE=1 \
            -e ALLOW_THINKING_OFF=1 \
            -e EXTRA_ENV="GR8_QW38_STRATA=1 GR8_QW38_VRAM_RESERVE_MIB=1920" \
            -e EXTRA_ARGS="--prefill 13312" \
            "$img" show-config --tp 1 --peers 127.0.0.1 \
            --model https://huggingface.co/kindlingai/Qwen3.8-Flash-Next-exlr8 --variant bit300 --no-check > /dev/null
          configs=$(docker run --rm --entrypoint python3 "$img" -c 'from tools.launch.models import QW38, INK2, HY4; [print(m.name, tp, m.release) for m in (QW38, INK2, HY4) for tp in m.tp]')
          test -n "$configs"
          while read -r model tp release; do
            peers=$(python3 -c 'import sys; print(",".join("192.0.2." + str(i+1) for i in range(int(sys.argv[1]))))' "$tp")
            docker run --rm -e GR8_MODEL="$model" "$img" show-config --tp "$tp" --peers "$peers" \
              --model "$release" --no-check > /dev/null
          done <<< "$configs"
          # no model stops in the entrypoint, with exit 2 and the line to add: nothing picks one
          rc=0; err=$(docker run --rm "$img" 2>&1 >/dev/null) || rc=$?
          echo "$err"
          [ "$rc" = 2 ] && echo "$err" | grep -q 'GR8_MODEL=glm53f' || { echo "model check: exit $rc"; exit 1; }
          # up with a limited memlock stops in the entrypoint, with exit 2 and the setting to change
          rc=0; err=$(docker run --rm -e GR8_MODEL=qw38 --ulimit memlock=65536:65536 "$img" 2>&1 >/dev/null) || rc=$?
          echo "$err"
          [ "$rc" = 2 ] && echo "$err" | grep -q 'memlock=-1' || { echo "memlock check: exit $rc"; exit 1; }
      - name: Push
        id: push
        if: env.PUSH == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for t in $TAGS; do docker push "$t"; done
          echo "digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$(echo "$TAGS" | head -1)" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        if: env.PUSH == 'true' && github.event.repository.visibility == 'public'
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  image-pr-amd64:
    name: Container image (linux/amd64)
    needs: [changes, rust-amd64, engine-amd64]
    if: ${{ needs.changes.outputs.push != 'true' && !cancelled() && needs.engine-amd64.result == 'success' && needs.rust-amd64.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      PUSH: false
    steps: *image-amd64-steps

  image-manifest:
    name: Container image (multi-arch manifest, push)
    # Publishes the multi-arch OCI manifest list (linux/arm64 sm_121a + linux/amd64 sm_120a) under latest, main, <tag>
    # and sha-<commit> so `ghcr.io/kindlingai/gr8:<tag>` resolves transparently on both GB10 and RTX 5090 hosts.
    needs: [changes, image, image-amd64]
    if: ${{ needs.changes.outputs.push == 'true' && !cancelled() && needs.image.result == 'success' && needs.image-amd64.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # main's runs overlap, so their pushes take turns, and latest and main move only to main's head (below)
    concurrency:
      group: image-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
      arm64_digest: ${{ needs.image.outputs.digest }}
      amd64_digest: ${{ needs.image-amd64.outputs.digest }}
      short_sha: ${{ steps.head.outputs.short_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ needs.changes.outputs.checkout_ref }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Is this commit still main's head?
        # a run that finishes after a newer commit's run pushes only its sha (and release tag), so latest never moves back
        id: head
        env:
          TAG: ${{ needs.changes.outputs.tag }}
        run: |
          commit=$(git rev-parse HEAD)
          short_sha=$(git rev-parse --short=7 HEAD)
          main_head=$(git ls-remote origin refs/heads/main | cut -f1)
          prerelease=false
          case "$TAG" in
            *-*) prerelease=true ;;
          esac
          head=false
          if [ "$commit" = "$main_head" ] && [ "$prerelease" = false ]; then
            if [ "$GITHUB_REF" = refs/heads/main ] || [ -n "$TAG" ]; then
              head=true
            fi
          fi
          {
            echo "head=$head"
            echo "short_sha=$short_sha"
          } >> "$GITHUB_OUTPUT"
          echo "main's head: $head (commit $short_sha, tag ${TAG:-none})"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          # latest and main follow main's head (never prereleases or older tag backfills); a tag gets its own name;
          # every image also gets sha-<commit>
          tags: |
            type=raw,value=latest,enable=${{ steps.head.outputs.head }}
            type=raw,value=main,enable=${{ steps.head.outputs.head }}
            type=raw,value=${{ needs.changes.outputs.tag || 'none' }},enable=${{ needs.changes.outputs.tag != '' }}
            type=raw,value=sha-${{ steps.head.outputs.short_sha }}
      - name: Create and push multi-arch manifest list
        id: merge
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          ARM64_DIGEST: ${{ needs.image.outputs.digest }}
          AMD64_DIGEST: ${{ needs.image-amd64.outputs.digest }}
        run: |
          set -euo pipefail
          image=$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          args=()
          while IFS= read -r t; do
            [ -n "$t" ] && args+=(-t "$t")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" \
            "${image}@${ARM64_DIGEST}" \
            "${image}@${AMD64_DIGEST}"
          first_tag=$(echo "$TAGS" | head -1)
          docker buildx imagetools inspect "$first_tag"
          docker buildx imagetools inspect --raw "$first_tag" > "$RUNNER_TEMP/manifest.json"
          jq -e '([.manifests[].platform | "\(.os)/\(.architecture)"] | contains(["linux/arm64", "linux/amd64"]))' \
            "$RUNNER_TEMP/manifest.json" >/dev/null
          digest="sha256:$(sha256sum "$RUNNER_TEMP/manifest.json" | awk '{print $1}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published multi-arch manifest list: $first_tag@$digest"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        if: github.event.repository.visibility == 'public'
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

  # Uploads the tester zip + SHA-256 (with build provenance when public) and appends the immutable GHCR image digests
  # and verification commands to the GitHub Release for tagged v* releases.
  github-release:
    name: GitHub Release artifacts
    needs: [changes, zip, image-manifest]
    if: ${{ needs.changes.outputs.push == 'true' && startsWith(needs.changes.outputs.tag, 'v') && !cancelled() && needs.image-manifest.result == 'success' && needs.zip.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: ${{ needs.zip.outputs.artifact_name }}
          path: dist
      - if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Upload release assets and update notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.changes.outputs.tag }}
          COMMIT: ${{ needs.changes.outputs.commit }}
          SHORT_SHA: ${{ needs.image-manifest.outputs.short_sha }}
          DIGEST: ${{ needs.image-manifest.outputs.digest }}
          ARM64_DIGEST: ${{ needs.image-manifest.outputs.arm64_digest }}
          AMD64_DIGEST: ${{ needs.image-manifest.outputs.amd64_digest }}
          ZIP_NAME: ${{ needs.zip.outputs.artifact_name }}
          PUBLIC: ${{ github.event.repository.visibility == 'public' }}
        run: |
          set -euo pipefail
          prerelease=false
          [[ "$TAG" == *-* ]] && prerelease=true
          {
            echo "<!-- gr8-artifacts:start -->"
            echo "### Artifacts"
            echo
            echo "- Container image (multi-arch: \`linux/arm64\` \`sm_121a\`, \`linux/amd64\` \`sm_120a\`): \`ghcr.io/$GH_REPO:$TAG@$DIGEST\`"
            echo "  - \`linux/arm64\` (\`sm_121a\`, GB10): \`ghcr.io/$GH_REPO:sha-$SHORT_SHA-arm64@$ARM64_DIGEST\`"
            echo "  - \`linux/amd64\` (\`sm_120a\`, RTX 5090 / Blackwell): \`ghcr.io/$GH_REPO:sha-$SHORT_SHA-amd64@$AMD64_DIGEST\`"
            echo "- Tester archive: \`$ZIP_NAME.zip\`, \`$ZIP_NAME.zip.sha256\` (commit \`$COMMIT\`)"
            if [ "$PUBLIC" = true ]; then
              echo
              echo "### Verification"
              echo
              echo '```bash'
              echo "gh attestation verify $ZIP_NAME.zip -R $GH_REPO"
              echo "gh attestation verify oci://ghcr.io/$GH_REPO@$DIGEST -R $GH_REPO"
              echo '```'
            fi
            echo "<!-- gr8-artifacts:end -->"
          } > artifacts.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release view "$TAG" --json body --jq .body > body.md
            python3 - <<'PY'
          import pathlib, re

          body = pathlib.Path("body.md").read_text()
          block = pathlib.Path("artifacts.md").read_text().strip()
          pattern = re.compile(
              r"<!-- gr8-artifacts:start -->.*?<!-- gr8-artifacts:end -->",
              re.DOTALL,
          )
          if pattern.search(body):
              updated = pattern.sub(lambda _: block, body, count=1)
          elif body.strip():
              updated = body.rstrip() + "\n\n" + block + "\n"
          else:
              updated = block + "\n"
          pathlib.Path("updated_body.md").write_text(updated)
          PY
            gh release edit "$TAG" --notes-file updated_body.md
          else
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --prerelease="$prerelease" \
              --generate-notes --notes-file artifacts.md
          fi

  finalize:
    name: Finalize
    # The check a PR needs to land. It runs after a failure or a cancellation too, so it always reports. It passes when
    # every job above succeeded or skipped, and a PR's run carries queue:ready (/ready), read live. A job skips by design
    # (the tester zip on a PR, whatever the changes job left out) or because a job it needs failed, which fails here
    # too. pr-ready.yml re-runs this job alone after /ready or /unready on a finished run.
    # The label counts only if it was added after GitHub first saw the head commit. pr-ready.yml removes it on a push,
    # but a run with only changes and zip-check can reach this step before that removal.
    if: always()
    needs: [changes, cpu, cpu-macos, rust, rust-amd64, engine, engine-amd64, engine-tests, env-lint, zip-check, zip, image, image-amd64, image-manifest, image-pr, image-pr-amd64, github-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const needs = JSON.parse(process.env.NEEDS);
            const bad = [];
            for (const [name, j] of Object.entries(needs)) {
              if (!["success", "skipped"].includes(j.result)) bad.push(`${name}: ${j.result}`);
            }
            // The PR: this run's, or for a run dispatched on a PR's branch the open PR whose head is this commit, whose
            // checks this run's count for. A push to main or a tag has none.
            let pr = context.eventName === "pull_request" ? context.payload.pull_request.number : null;
            // a pull_request run's context.sha is the merge commit
            const head = context.eventName === "pull_request" ? context.payload.pull_request.head.sha : context.sha;
            if (context.eventName === "workflow_dispatch") {
              const prs = (await github.rest.repos.listPullRequestsAssociatedWithCommit(
                { ...context.repo, commit_sha: context.sha })).data;
              const open = prs.find(p => p.state === "open" && p.head.sha === context.sha);
              if (open) pr = open.number;
            }
            if (pr) {
              const labels = (await github.rest.issues.listLabelsOnIssue(
                { ...context.repo, issue_number: pr, per_page: 100 })).data.map(l => l.name);
              if (!labels.includes("queue:ready")) bad.push(`#${pr} is not marked ready (/ready)`);
              else {
                // when the label was last added, and when GitHub first saw the head (its earliest check suite)
                const events = await github.paginate(github.rest.issues.listEvents,
                  { ...context.repo, issue_number: pr, per_page: 100 });
                const added = events.filter(e => e.event === "labeled" && e.label && e.label.name === "queue:ready")
                  .map(e => Date.parse(e.created_at));
                const suites = (await github.rest.checks.listSuitesForRef(
                  { ...context.repo, ref: head, per_page: 100 })).data.check_suites.map(s => Date.parse(s.created_at));
                if (!added.length || !suites.length || Math.max(...added) <= Math.min(...suites))
                  bad.push(`#${pr} was marked ready before ${head.slice(0, 7)} was pushed (/ready again)`);
              }
            }
            const rows = Object.entries(needs).map(([name, j]) => [name, j.result]);
            await core.summary.addTable([[{ data: "job", header: true }, { data: "result", header: true }], ...rows])
              .addRaw(bad.length ? `Not ready to land: ${bad.join("; ")}` : "Ready to land").write();
            if (bad.length) core.setFailed(`Not ready to land: ${bad.join("; ")}`);
