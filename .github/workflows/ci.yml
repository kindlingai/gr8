# CPU tests, the Rust binaries, the arm64 engine build, the tester zip and the container image, which goes to
# ghcr.io/kindlingai/gr8 from main and from tags.
#
# Every job runs on GitHub's hosted runners, for every pull request, forks included. The engine job builds the
# Dockerfile's binaries on arm64 runners, one per KV format, no GPU needed to compile. The image job assembles the
# runtime image from both of their artifacts, and only it can write packages: it pushes from main and from tags, never
# from a pull request.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*', 'beta-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cpu:
    name: CPU tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Python packages
        run: python -m pip install numpy xxhash
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            engine/loader-rs/target
            engine/kvman-rs/target
            frontend/g6front-rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Tests
        run: .github/ci/cpu-tests.sh

  rust:
    name: Rust binaries (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - name: Build the loader and the front end (Dockerfile target rust-dist)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          target: rust-dist
          platforms: linux/arm64
          outputs: type=local,dest=rust-dist
          cache-from: type=gha,scope=rust
          cache-to: type=gha,scope=rust,mode=max
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: rust-bin-arm64
          path: rust-dist/
          retention-days: 7
          if-no-files-found: error

  engine:
    # The two KV formats are the whole cost of a build and share no compilation,
    # so they get a runner each: on one runner they spent most of their lives
    # competing for its four cores (fp8 ~1,000 s, int4 ~551 s, job 1,187 s).
    name: Engine build (${{ matrix.kv }} KV, arm64, CUDA 13, sm_121a)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both legs share every stage before the compile (toolchain, rust,
          # the three cargo builds, engine-src), and neither leg's own compile
          # layer survives a change under engine/, which is most pull requests.
          # So one leg exports the cache for both: a scope each would double
          # what this repo keeps in a cache that is already at its 10 GB cap.
          - kv: fp8
            target: dist-fp8
            cache_to: type=gha,scope=gr8,mode=max
          - kv: int4
            target: dist-int4
            cache_to: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Free disk space
        # the CUDA devel image is about 10 GB unpacked
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - name: Widths
        # A pull request compiles the three widths whose code differs: 1, the
        # PF_F12 fat-CTA width 4, and the largest. main and tags compile all
        # six, so a width-specific break still fails before a release.
        id: w
        run: |
          widths=''
          [ "${{ github.event_name }}" = pull_request ] && widths='1 4 8'
          echo "widths=$widths" >> "$GITHUB_OUTPUT"
          echo "${{ matrix.kv }} KV, TP widths ${widths:-1 2 3 4 6 8}" >> "$GITHUB_STEP_SUMMARY"
      - name: Build the binaries (Dockerfile target ${{ matrix.target }})
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/arm64
          build-args: |
            G6_WIDTHS=${{ steps.w.outputs.widths }}
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=gr8
          cache-to: ${{ matrix.cache_to }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: engine-bin-arm64-${{ matrix.kv }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  zip:
    name: Tester zip
    if: github.event_name != 'pull_request'
    needs: [cpu, engine]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: engine-bin-arm64-*
          merge-multiple: true
          path: dist
      - name: Assemble
        id: zip
        run: |
          python3 scripts/make_zip.py --bin dist --out out
          echo "name=gr8-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          { echo '### Tester zip'; echo; echo '```'; cat out/*.sha256; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ steps.zip.outputs.name }}
          path: |
            out/*.zip
            out/*.zip.sha256
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

  image:
    name: Container image (linux/arm64)
    # The runtime image around the engine job's binaries: the Dockerfile's dist stage is replaced by them (a named build
    # context), so nothing is compiled here. Pushed to ghcr.io from main and from tags, never from a pull request.
    needs: [cpu, engine]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      PUSH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: engine-bin-arm64-*
          merge-multiple: true
          path: ${{ runner.temp }}/dist
      - name: Restore the executable bits (artifacts drop them)
        run: find "$RUNNER_TEMP/dist" -type f ! -name '*.a' -exec chmod 755 {} +
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # latest and main follow main; a tag gets its own name; every image also gets sha-<commit>
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha
      - name: Build the runtime image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          target: runtime
          platforms: linux/arm64
          build-contexts: dist=${{ runner.temp }}/dist
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max
      - name: Smoke test (no GPU)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          img=$(echo "$TAGS" | head -1)
          docker image ls "$img"
          docker run --rm --entrypoint bash "$img" -c '
            set -eu
            for b in bin/g6m4 bin/g6m4-int4 bin/m4sim bin/gpuprobe bin/g6front-rs bin/g6load bin3/g6m4 bin3/g6m4-int4 bin6/g6m4 bin6/g6m4-int4 bin6/m4sim; do
              if ldd "$b" | grep "not found"; then echo "$b: missing libraries"; exit 1; fi
            done
            python3 -c "import g6s2shim"
            python3 -c "import tools.convert.convert, tools.convert.dflash2"
            PYTHONPATH=tools/launch python3 -c "import supervisor, steering_hf; from steering import release"
            python3 tools/steering/release.py --help > /dev/null
            python3 tools/steering/evaluate.py --help > /dev/null
            python3 tools/steering/trace_audit.py --help > /dev/null
            bin/g6front-rs --help > /dev/null
            echo smoke OK'
          docker run --rm "$img" show-config --peers 192.0.2.1,192.0.2.2,192.0.2.3,192.0.2.4 \
            --model https://huggingface.co/kindlingai/glm-5.3-exlr8-k2-k3-k4 --no-check > /dev/null
      - name: Push
        id: push
        if: env.PUSH == 'true'
        # the tags are one per line: through env, not pasted into the script
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for t in $TAGS; do docker push "$t"; done
          echo "digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$(echo "$TAGS" | head -1)" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        if: env.PUSH == 'true'
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
