# Asks a PR's author to tick one merge-queue category in the description (.github/pull_request_template.md) and labels
# the PR with it. pull_request_target, so it can comment on PRs from forks: it never checks out or runs the PR's code,
# and reads the description only as text.
name: PR category
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: write
  issues: write

jobs:
  category:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        with:
          script: |
            const cats = [
              ["Bit-exact / off by default", "risk:bit-exact", "0e8a16"],
              ["Changes defaults or performance", "risk:default-change", "d93f0b"],
              ["Front end only", "risk:frontend", "1d76db"],
              ["Docs or tests only", "risk:docs-tests", "c5def5"],
            ];
            const pr = context.payload.pull_request;
            const body = pr.body || "";
            const ticked = cats.filter(([t]) =>
              new RegExp(`^\\s*[-*] \\[[xX]\\] \\**${t.replace(/[/]/g, "\\/")}`, "m").test(body));
            const { owner, repo } = context.repo;
            const issue_number = pr.number;
            const marker = "<!-- pr-category-bot -->";
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.body.includes(marker));

            for (const [, name, color] of cats) {
              await github.rest.issues.createLabel({ owner, repo, name, color }).catch(() => {});
            }
            const current = pr.labels.map(l => l.name).filter(n => n.startsWith("risk:"));

            if (ticked.length === 1) {
              const want = ticked[0][1];
              for (const l of current.filter(n => n !== want)) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: l }).catch(() => {});
              }
              if (!current.includes(want)) {
                await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [want] });
              }
              if (mine) await github.rest.issues.deleteComment({ owner, repo, comment_id: mine.id });
              return;
            }

            const msg = `${marker}\n@${pr.user.login}, please tick **exactly one** merge-queue category in the PR ` +
              `description (${ticked.length} ticked now). The queue batches PRs by category:\n\n` +
              cats.map(([t]) => `- [ ] ${t}`).join("\n") +
              `\n\nIf the template section is missing, paste the list above into the description and tick one.`;
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body: msg });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body: msg });
            core.setFailed(`expected exactly one category, found ${ticked.length}`);
