# The merge queue's ready flag: the label queue:ready, set and cleared only through this workflow.
#   /ready or /unready, commented on a PR by a maintainer in READY_USERS, adds or removes it. Commands need no write
#   access, so a maintainer with read access can use them. /ready needs a risk:* category label (pr-category.yml).
#   The label added by anyone else is removed again, and a push to the PR clears it: ready means the reviewed commits.
#   /ready on a PR labelled risk:docs-tests whose every changed file is Markdown approves it as github-actions[bot] and
#   squash-merges it: ci.yml skips such PRs, and the maintainer's /ready stands in for the review. Approving needs the
#   repo setting "Allow GitHub Actions to create and approve pull requests". The review and the merge name the head
#   the bot checked, so a push in between makes them fail rather than land unchecked commits.
# pull_request_target and issue_comment run the default branch's copy; neither checks out or runs the PR's code.
name: PR ready
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [labeled, synchronize]

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  READY_USERS: coffee-the-dev,mmastrac,chuck-ads
  READY_LABEL: queue:ready

jobs:
  ready:
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        with:
          script: |
            const allowed = process.env.READY_USERS.split(",");
            const label = process.env.READY_LABEL;
            const { owner, repo } = context.repo;
            const ev = context.eventName;
            const sender = context.payload.sender.login;
            const pr = ev === "issue_comment" ? context.payload.issue : context.payload.pull_request;
            const issue_number = pr.number;
            const labels = pr.labels.map(l => l.name);
            const say = body => github.rest.issues.createComment({ owner, repo, issue_number, body });
            const drop = () => github.rest.issues.removeLabel({ owner, repo, issue_number, name: label }).catch(() => {});
            await github.rest.issues.createLabel({ owner, repo, name: label, color: "5319e7",
              description: "Marked ready for the merge queue by a maintainer (/ready)" }).catch(() => {});

            if (ev === "issue_comment") {
              const cmd = (context.payload.comment.body || "").trim().split(/\s+/)[0];
              if (cmd !== "/ready" && cmd !== "/unready") return;
              const react = content => github.rest.reactions.createForIssueComment(
                { owner, repo, comment_id: context.payload.comment.id, content });
              if (!allowed.includes(sender)) {
                await react("confused");
                await say(`@${sender}, only ${allowed.map(u => "@" + u).join(", ")} can mark a PR ready.`);
                return;
              }
              if (cmd === "/unready") {
                await drop();
                await react("+1");
                return;
              }
              if (!labels.some(n => n.startsWith("risk:"))) {
                await react("confused");
                await say(`@${sender}, this PR has no merge-queue category yet: tick one in the description first.`);
                return;
              }
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [label] });
              await react("+1");
              if (!labels.includes("risk:docs-tests")) return;
              const head = (await github.rest.pulls.get({ owner, repo, pull_number: issue_number })).data.head.sha;
              const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: issue_number });
              const md = f => /\.md$/i.test(f);
              if (!files.length || !files.every(f => md(f.filename) && (!f.previous_filename || md(f.previous_filename)))) return;
              try {
                await github.rest.pulls.createReview({ owner, repo, pull_number: issue_number, commit_id: head, event: "APPROVE",
                  body: `Approved for @${sender}'s /ready: every changed file is Markdown.` });
                await github.rest.pulls.merge({ owner, repo, pull_number: issue_number, sha: head, merge_method: "squash" });
                await say(`Markdown-only docs PR marked ready by @${sender}: merged.`);
              } catch (e) {
                await say(`Markdown-only docs PR marked ready, but approving or merging failed: ${e.message}`);
              }
              return;
            }

            const act = context.payload.action;
            if (act === "labeled" && context.payload.label.name === label && !allowed.includes(sender)) {
              await drop();
              await say(`@${sender}, \`${label}\` is set by a maintainer commenting \`/ready\`; removed.`);
            } else if (act === "synchronize" && labels.includes(label)) {
              await drop();
              await say(`New commits since this PR was marked ready: \`${label}\` cleared. A maintainer can comment \`/ready\` again.`);
            }
