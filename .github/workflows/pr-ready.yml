# The merge queue's ready flag (queue:ready) and maintainer-requested CI (ci:requested), set and cleared only here.
#   /ready, /unready and /ci, commented on an open PR by a maintainer in READY_USERS, set or clear them. Commands need
#   no write access, so a maintainer with read access can use them. /ready needs a risk:* category label
#   (pr-category.yml), or applies the one ticked in the description; /ci runs CI without queueing the PR.
#   Either label added by anyone else is removed again. A push to the PR clears both: they always refer to the commits
#   a maintainer looked at. A command is refused if the PR's head was pushed after the comment, and a label is dropped
#   again if the head moves while the command is handled.
#   ci.yml's jobs run on a PR only while it carries one of the labels: setting one re-runs the PR's latest CI run (or
#   approves it, if it waits for approval), since labels added with GITHUB_TOKEN cannot start workflows.
#   ci.yml's Finalize reads queue:ready when it runs, so /ready, /unready and a maintainer removing the label re-run
#   that job alone on a run that has finished.
#   /ready on an open PR labelled risk:docs-tests that changes only Markdown files squash-merges it once its CI run's
#   Finalize passes (the run checks nothing else for such a PR). Not eligible: files
#   under .github/, AGENTS.md and CLAUDE.md (read by GitHub and by coding agents), symlinks, mode changes, and PRs too
#   large to list completely. The bot also approves it as github-actions[bot] when "Allow GitHub Actions to create and
#   approve pull requests" is on (org and repo), which a required review needs. The review and the merge name the head
#   the bot checked.
# pull_request_target and issue_comment run the default branch's copy; neither checks out or runs the PR's code.
name: PR ready
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [labeled, unlabeled, synchronize]

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write
  issues: write

env:
  READY_USERS: coffee-the-dev,mmastrac,chuck-ads
  READY_LABEL: queue:ready
  CI_LABEL: ci:requested

jobs:
  ready:
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        env:
          # A maintainer's fine-grained token with Actions: Read and write on this repository only. Used only to
          # start runs (re-run, workflow_dispatch, approval); everything else uses GITHUB_TOKEN. May be empty.
          CI_TRIGGER_TOKEN: ${{ secrets.CI_TRIGGER_TOKEN }}
        with:
          script: |
            const allowed = process.env.READY_USERS.split(",");
            const label = process.env.READY_LABEL;
            const ciLabel = process.env.CI_LABEL;
            const { owner, repo } = context.repo;
            const ev = context.eventName;
            const sender = context.payload.sender.login;
            const issue_number = (ev === "issue_comment" ? context.payload.issue : context.payload.pull_request).number;
            const say = body => github.rest.issues.createComment({ owner, repo, issue_number, body });
            const remove = name => github.rest.issues.removeLabel({ owner, repo, issue_number, name })
              .then(() => true, () => false);
            const pull = async () => (await github.rest.pulls.get({ owner, repo, pull_number: issue_number })).data;
            const liveLabels = async () => (await github.rest.issues.listLabelsOnIssue(
              { owner, repo, issue_number, per_page: 100 })).data.map(l => l.name);
            const sleep = ms => new Promise(r => setTimeout(r, ms));
            await github.rest.issues.createLabel({ owner, repo, name: label, color: "5319e7",
              description: "Marked ready for the merge queue by a maintainer (/ready)" }).catch(() => {});
            await github.rest.issues.createLabel({ owner, repo, name: ciLabel, color: "bfd4f2",
              description: "CI requested by a maintainer (/ci), without queueing" }).catch(() => {});

            // When GitHub first saw this commit: the earliest check suite on it, created on the push. Server time, so a
            // backdated commit cannot hide a push behind a maintainer's comment. null if there is no suite.
            const firstSeen = async sha => {
              const suites = (await github.rest.checks.listSuitesForRef({ owner, repo, ref: sha, per_page: 100 }))
                .data.check_suites.map(s => Date.parse(s.created_at));
              return suites.length ? Math.min(...suites) : null;
            };

            // Runs are started with CI_TRIGGER_TOKEN when the secret is set, so they run as that maintainer: a re-run
            // started with GITHUB_TOKEN fails at startup (GitHub accepts it, then fails it seconds later), and some
            // starts fail at random. A start that fails is retried once with the token; after that, or without it,
            // the bot asks a maintainer to re-run the run. A run first triggered by an author whose runs are refused
            // cannot be re-run by anyone.
            const token = process.env.CI_TRIGGER_TOKEN;
            const starter = token
              ? (typeof getOctokit === "function" ? getOctokit(token) : new github.constructor({ auth: token }))
              : github;
            let retries = token ? 1 : 0;

            // Start CI on the PR head: find its latest ci.yml run, approve it if it waits for approval, and re-run it
            // once its ready gate has turned it away. Waits up to 5 minutes for the gate; reports anything else.
            // startCI below picks between this and a dispatched run.
            const askHuman = (run, why) => say(`CI on ${run.head_sha.slice(0, 7)} is cleared to run, but ${why}. ` +
              `A maintainer with write access can start it: open ${run.html_url} and choose **Re-run all jobs**.`);
            // Re-run RUN and watch it start; a failed start is retried while retries last, then a maintainer is asked.
            const restart = async run => {
              for (;;) {
                try {
                  await starter.rest.actions.reRunWorkflow({ owner, repo, run_id: run.id });
                } catch (e) {
                  await askHuman(run, `the bot could not re-run it (${e.message})`);
                  return;
                }
                let failed = false;
                for (let k = 0; k < 9 && !failed; k++) {
                  await sleep(10000);
                  const now = (await github.rest.actions.getWorkflowRun({ owner, repo, run_id: run.id })).data;
                  if (now.conclusion === "startup_failure") failed = true;
                  else if (now.status !== "completed") return;            // the re-run is running
                }
                if (failed && retries > 0) { retries--; continue; }
                await askHuman(run, failed ? "the bot's re-run failed to start" : "the bot's re-run has not started after 90 seconds");
                return;
              }
            };
            // the PR head's ci.yml runs started by EVENTS, newest first
            const prRuns = async (p, events = ["pull_request"]) => (await github.rest.actions.listWorkflowRuns(
              { owner, repo, workflow_id: "ci.yml", head_sha: p.head.sha, per_page: 20 })).data.workflow_runs
              .filter(r => events.includes(r.event) && (r.pull_requests.some(x => x.number === issue_number) ||
                (r.head_repository && r.head_repository.full_name === p.head.repo.full_name &&
                 r.head_branch === p.head.ref)));
            // ci.yml's Finalize reads queue:ready when it runs. Once it has run, re-run it alone so it sees the label as
            // it is now; one still waiting for the other jobs reads it when it starts.
            const refinalize = async run => {
              for (let i = 0; i < 12; i++) {
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun,
                  { owner, repo, run_id: run.id, filter: "latest" });
                const fin = jobs.find(j => j.name === "Finalize");
                if (!fin || (fin.status !== "in_progress" && fin.status !== "completed")) return;
                if (fin.status === "in_progress") { await sleep(10000); continue; }
                try {
                  await starter.rest.actions.reRunJobForWorkflowRun({ owner, repo, job_id: fin.id });
                } catch (e) {
                  await say(`The bot could not re-run Finalize (${e.message}): open ${run.html_url} and re-run that job.`);
                }
                return;
              }
            };
            // the newest PR run and the newest dispatched run of the head, after queue:ready went
            const unfinalize = async p => {
              const runs = await prRuns(p, ["pull_request", "workflow_dispatch"]);
              for (const ev of ["pull_request", "workflow_dispatch"]) {
                const run = runs.find(r => r.event === ev);
                if (run) await refinalize(run);
              }
            };
            // Whether a ci.yml run of the PR head that started after SINCE (a PR run's re-run, or a dispatched run) has
            // passed Finalize. Waits up to 6 minutes, enough for a Markdown-only run, which has only the gate and Finalize.
            const finalized = async (p, since) => {
              for (let i = 0; i < 36; i++) {
                await sleep(10000);
                for (const run of await prRuns(p, ["pull_request", "workflow_dispatch"])) {
                  if (run.status !== "completed" || Date.parse(run.run_started_at) < since) continue;
                  const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun,
                    { owner, repo, run_id: run.id, filter: "latest" });
                  const fin = jobs.find(j => j.name === "Finalize");
                  if (fin && fin.conclusion === "success") return true;
                }
              }
              return false;
            };
            const rerunCI = async p => {
              const head = p.head.sha;
              let approved = false;
              for (let i = 0; i < 30; i++) {
                const runs = await prRuns(p);
                if (!runs.length) {
                  if (i < 6) { await sleep(10000); continue; }
                  await say(`No CI run found for ${head.slice(0, 7)}, so there is nothing to start.`);
                  return;
                }
                const run = runs[0];
                if (run.conclusion === "action_required") {
                  if (approved) { await sleep(10000); continue; }
                  approved = true;
                  try {
                    await starter.rest.actions.approveWorkflowRun({ owner, repo, run_id: run.id });
                  } catch (e) {
                    await say(`CI for ${head.slice(0, 7)} waits for approval and the bot could not approve it ` +
                      `(${e.message}): approve it at ${run.html_url}.`);
                    return;
                  }
                  await sleep(10000);
                  continue;
                }
                if (run.conclusion === "startup_failure") {
                  if (retries > 0) {
                    retries--;
                    await restart(run);
                  } else {
                    await askHuman(run, "its last start failed and the bot could not start it");
                  }
                  return;
                }
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun,
                  { owner, repo, run_id: run.id, filter: "latest" });
                const gate = jobs.find(j => j.name === "Ready gate");
                if (gate && gate.status === "completed") {
                  // Finalize runs even when the gate turned the run away
                  if (jobs.some(j => j !== gate && j.name !== "Finalize" && j.conclusion !== "skipped")) {
                    await refinalize(run);   // already building, or built
                    return;
                  }
                  if (run.status === "completed") {
                    await restart(run);
                    return;
                  }
                }
                await sleep(10000);
              }
              await say(`Timed out waiting for CI on ${head.slice(0, 7)} to reach its ready gate.`);
            };

            // With CI_TRIGGER_TOKEN the PR's own run is re-run, so its checks replace the failed gate on the PR page.
            // Without the token a re-run fails at startup, so a PR whose branch is in this repository gets a
            // workflow_dispatch run of ci.yml on its branch instead. The gate always passes such runs, but GitHub lists
            // them only on the commit, not on the PR, so the bot links the run. A fork's branch cannot be dispatched.
            // A run GitHub refused to start ("Actor is not allowed to trigger Actions workflows", which the PR's author
            // can get) cannot be re-run either, so it gets a dispatched run too, token or not.
            const startCI = async p => {
              const refused = token && ((await prRuns(p))[0] || {}).conclusion === "startup_failure";
              if ((!token || refused) && p.head.repo && p.head.repo.full_name === `${owner}/${repo}`) {
                const since = Date.now() - 5000;
                try {
                  await starter.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: "ci.yml", ref: p.head.ref });
                  for (let i = 0; i < 12; i++) {
                    await sleep(10000);
                    const run = (await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: "ci.yml",
                      event: "workflow_dispatch", head_sha: p.head.sha, per_page: 5 })).data.workflow_runs
                      .find(r => Date.parse(r.created_at) >= since);
                    if (!run) continue;
                    if (run.conclusion === "startup_failure") break;
                    await say(`CI is running on ${p.head.sha.slice(0, 7)}: ${run.html_url}. The PR's checks do not list ` +
                      `this run, so they still show the failed ready gate.`);
                    return;
                  }
                } catch (e) {
                  core.info(`workflow_dispatch failed: ${e.message}`);
                }
              }
              await rerunCI(p);
            };

            // The category the author ticked, as pr-category.yml reads it (same list): its label, or null unless
            // exactly one is ticked. /ready applies it when pr-category.yml never ran (an author whose runs are refused).
            const tickedCategory = body => {
              const cats = [["Bit-exact / off by default", "risk:bit-exact"],
                ["Changes defaults or performance", "risk:default-change"], ["Front end only", "risk:frontend"],
                ["Docs or tests only", "risk:docs-tests"]];
              const ticked = cats.filter(([t]) =>
                new RegExp(`^\\s*[-*] \\[[xX]\\] \\**${t.replace(/[/]/g, "\\/")}`, "m").test(body || ""));
              return ticked.length === 1 ? ticked[0][1] : null;
            };

            if (ev === "issue_comment") {
              const cmd = (context.payload.comment.body || "").trim().split(/\s+/)[0];
              if (cmd !== "/ready" && cmd !== "/unready" && cmd !== "/ci") return;
              const react = content => github.rest.reactions.createForIssueComment(
                { owner, repo, comment_id: context.payload.comment.id, content });
              if (!allowed.includes(sender)) {
                await react("confused");
                await say(`@${sender}, only ${allowed.map(u => "@" + u).join(", ")} can run \`${cmd}\`.`);
                return;
              }
              if (cmd === "/unready") {
                await remove(label);
                await react("+1");
                await unfinalize(await pull());
                return;
              }
              const p = await pull();
              if (p.state !== "open") {
                await react("confused");
                await say(`@${sender}, \`${cmd}\` only works on an open PR.`);
                return;
              }
              const said = Date.parse(context.payload.comment.created_at);
              const seen = await firstSeen(p.head.sha);
              if (seen !== null && seen > said) {
                await react("confused");
                await say(`@${sender}, new commits arrived after your \`${cmd}\`: check ${p.head.sha.slice(0, 7)} and comment again.`);
                return;
              }
              const name = cmd === "/ci" ? ciLabel : label;
              if (cmd === "/ready" && !(await liveLabels()).some(n => n.startsWith("risk:"))) {
                const cat = tickedCategory(p.body);
                if (!cat) {
                  await react("confused");
                  await say(`@${sender}, this PR has no merge-queue category yet: tick exactly one in the description first.`);
                  return;
                }
                await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [cat] });
              }
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [name] });
              const after = await pull();
              if (after.head.sha !== p.head.sha) {
                await remove(name);
                await react("confused");
                await say(`@${sender}, the PR moved to ${after.head.sha.slice(0, 7)} while \`${cmd}\` was handled: check it and comment again.`);
                return;
              }
              await react("+1");
              if (cmd === "/ci" || !(await liveLabels()).includes("risk:docs-tests")) {
                await startCI(p);
                return;
              }

              // Markdown-only docs PRs merge on /ready; anything else falls back to CI.
              const head = p.head.sha;
              const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: issue_number });
              const md = f => /\.md$/i.test(f);
              const names = files.flatMap(f => f.previous_filename ? [f.filename, f.previous_filename] : [f.filename]);
              if (!files.length || !names.every(md)) {      // not Markdown-only: it has CI, run that
                await startCI(p);
                return;
              }
              // Markdown-only: merge it once Finalize passes, or say why not.
              let why = null;
              if (files.length >= 3000 || files.length !== p.changed_files) why = "the file list is incomplete";
              else if (files.length > 50) why = "it changes more than 50 files";
              else if (names.some(f => /^\.github\//.test(f) || /(^|\/)(AGENTS|CLAUDE)\.md$/i.test(f)))
                why = "it touches .github/, AGENTS.md or CLAUDE.md";
              else if (!files.every(f => ["added", "modified", "renamed", "removed"].includes(f.status)))
                why = "a file changes mode or is copied";
              for (const f of why ? [] : files.filter(f => f.status !== "removed")) {
                let type = null;
                try {
                  const c = await github.rest.repos.getContent({ owner, repo, path: f.filename, ref: head });
                  type = Array.isArray(c.data) ? "dir" : c.data.type;
                } catch (e) {
                  type = "unreadable";
                }
                if (type !== "file") { why = `${f.filename} is a ${type}, not a file`; break; }
              }
              if (why) {
                await say(`Markdown-only PR marked ready, but not merged automatically because ${why}: merge it by hand.`);
                return;
              }
              const since = Date.now() - 5000;
              await startCI(p);
              if (!(await finalized(p, since))) {
                await say(`Markdown-only PR marked ready, but its Finalize check has not passed: see its CI run.`);
                return;
              }
              // Approval is best effort: it needs "Allow GitHub Actions to create and approve pull requests", and the merge
              // only needs it while the ruleset requires a review.
              let note = "";
              try {
                await github.rest.pulls.createReview({ owner, repo, pull_number: issue_number, commit_id: head, event: "APPROVE",
                  body: `Approved for @${sender}'s /ready: every changed file is Markdown.` });
              } catch (e) {
                note = ` (no approval: ${e.message})`;
              }
              try {
                await github.rest.pulls.merge({ owner, repo, pull_number: issue_number, sha: head, merge_method: "squash" });
                await say(`Markdown-only docs PR marked ready by @${sender}: merged${note}.`);
              } catch (e) {
                await say(`Markdown-only docs PR marked ready, but the merge failed${note}: ${e.message}`);
              }
              return;
            }

            const act = context.payload.action;
            const added = act === "labeled" ? context.payload.label.name : null;
            if ((added === label || added === ciLabel) && !allowed.includes(sender)) {
              await remove(added);
              const how = added === label ? "/ready" : "/ci";
              await say(`@${sender}, \`${added}\` is set by a maintainer commenting \`${how}\`, so it was removed.`);
            } else if (added === label || added === ciLabel) {
              await startCI(await pull());
            } else if (act === "unlabeled" && context.payload.label.name === label) {
              await unfinalize(await pull());
            } else if (act === "synchronize") {
              // Remove both whatever the event's labels say: a label added after the event was built must go too.
              await remove(ciLabel);
              if (await remove(label)) {
                await say(`New commits since this PR was marked ready: \`${label}\` cleared. A maintainer can comment \`/ready\` again.`);
              }
            }
