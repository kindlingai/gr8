name: console
on:
  pull_request:
    paths: ['tools/console/**', '.github/workflows/console.yml']
  push:
    paths: ['tools/console/**', '.github/workflows/console.yml']
permissions:
  contents: read
jobs:
  off-ring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4.3.0
        with:
          version: '10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
      - run: pip install -r tools/console/server/requirements.txt playwright
      - run: playwright install --with-deps chromium
      - run: python3 -m unittest discover -s tools/console/tests -v
      - run: cd tools/console/web && pnpm install --frozen-lockfile && pnpm build
      - run: python3 tools/console/tests/browser.py --output console-screenshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: console-screenshots
          path: console-screenshots/
