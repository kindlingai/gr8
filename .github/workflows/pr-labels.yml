# Labels a PR with the areas its files touch (.github/labeler.yml), on every push to it.
# pull_request_target, so it can label PRs from forks: actions/labeler reads the default branch's labeler.yml and the
# PR's file list through the API, and nothing checks out or runs the PR's code.
name: PR labels
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13  # v7.0.0
        with:
          sync-labels: true
