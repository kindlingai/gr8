# The pseudo engine's weights (frontend/pseudo-engine/README.md): rules that map a prompt to a reply.
#
# Every rule whose regex matches is a candidate. The most specific wins: the higher `specificity`, then the longer
# match, then the earlier rule. A rule reads one part of the prompt (`on`): "user" (the last user message, default),
# "tool" (the last tool result, when the prompt ends with one), "system" (the system messages and the tool block) or
# "prompt" (all of it). `tools` lists tools the prompt must define ("*" for any). The reply is `reasoning` (default
# [engine].reasoning), `content` and any `[[rule.call]]`s; `fill = true` repeats the content until max_tokens.
# Captures go into the reply as $1 or ${name} (regex crate syntax; $$ is a literal $).
#
# Rules match with the regex crate (no look-around). Add a rule with a specificity above the ones it should beat.

[engine]
model = "glm-5.3"
max_model_len = 200000
tokens_per_s = 2000
chunk = 4
reasoning = "Let me work out the answer."

[fallback]
content = "I am the gr8 pseudo engine, and no rule in my weights matches this prompt."

# ---- smoketest/run.sh ----------------------------------------------------------------------------------------

[[rule]]
name = "capital-of-australia"
match = '(?i)capital of australia'
specificity = 10
reasoning = "The capital of Australia is Canberra, not Sydney."
content = "Canberra"

[[rule]]
name = "capital-of-france"
match = '(?i)capital of france'
specificity = 10
reasoning = "France's capital is Paris."
content = "Paris"

[[rule]]
name = "capital-of-france-completion"
match = 'capital of France is\s*$'
on = "prompt"
specificity = 20
content = " Paris, which is also its largest city."

[[rule]]
name = "17x23"
match = '17\s*[*x×]\s*23'
specificity = 10
reasoning = "17 times 23: 17 * 20 = 340, 17 * 3 = 51, 340 + 51 = 391."
content = "391"

[[rule]]
name = "say-hi"
match = '(?i)^say (hi|hello)\b'
specificity = 5
reasoning = "A short greeting."
content = "Hi! How can I help?"

[[rule]]
name = "hello-in-french"
match = '(?i)hello in french'
specificity = 10
content = "Bonjour !"

[[rule]]
name = "count-to-fifty-in-words"
match = '(?i)count from one to fifty in words'
specificity = 10
content = "one, two, three, four, five, six, seven, eight, nine, ten, eleven, twelve, thirteen, fourteen, fifteen, sixteen, seventeen, eighteen, nineteen, twenty, twenty, twenty-one, twenty-two, twenty-three, twenty-four, twenty-five, twenty-six, twenty-seven, twenty-eight, twenty-nine, thirty, thirty-one, thirty-two, thirty-three, thirty-four, thirty-five, thirty-six, thirty-seven, thirty-eight, thirty-nine, forty, forty-one, forty-two, forty-three, forty-four, forty-five, forty-six, forty-seven, forty-eight, forty-nine, fifty."

