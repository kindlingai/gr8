[[rule]]
name = "weather-call"
match = '(?i)weather (?:in|for) (?P<city>[A-Z][\w-]*)'
tools = ["get_weather"]
specificity = 10
reasoning = "The user wants the weather in ${city}, and get_weather can tell me."
content = "Let me check the weather in ${city}."
[[rule.call]]
name = "get_weather"
arguments = { city = "${city}" }

[[rule]]
name = "weather-no-tool"
match = '(?i)\bweather\b'
content = "I can't look up live weather without a tool."

# ---- bench/toolbench scenarios -----------------------------------------------------------------------------

[[rule]]
name = "weather-two-cities"
match = '(?i)weather for (?P<a>[A-Z][\w-]*) and (?:for )?(?P<b>[A-Z][\w-]*)(?:.*?(?P<days>\d+) days?)?'
tools = ["get_weather"]
specificity = 20
reasoning = "Two cities, so two calls at once."
[[rule.call]]
name = "get_weather"
arguments = { city = "${a}", days = 2 }
[[rule.call]]
name = "get_weather"
arguments = { city = "${b}", days = 2 }

[[rule]]
name = "weather-days-metric"
match = '(?i)weather in (?P<city>[A-Z][\w-]*) for the next (?P<days>\d+) days, in metric'
tools = ["get_weather"]
specificity = 30
[[rule.call]]
name = "get_weather"
arguments = { city = "${city}", days = "${days}", metric = true }

[[rule]]
name = "write-file"
match = '(?i)write a file (?P<path>[\w./-]+)'
tools = ["write_file"]
specificity = 10
content = "I'll write ${path}."
[[rule.call]]
name = "write_file"
arguments = { path = "${path}", content = "# ${path}\nprint('hello')\n" }

[[rule]]
name = "search-docs"
match = '(?i)search the docs for "(?P<q>[^"]+)"'
tools = ["search"]
specificity = 10
[[rule.call]]
name = "search"
arguments = { query = "${q}" }

[[rule]]
name = "sql-users"
match = '(?i)users in (?P<city>[A-Z]\w+) older than (?P<age>\d+)'
tools = ["run_query"]
specificity = 10
[[rule.call]]
name = "run_query"
arguments = { sql = "SELECT * FROM users WHERE city = :city AND age > :age", params = { city = "${city}", age = "${age}" }, limit = 10 }

[[rule]]
name = "create-event"
match = '(?i)create an event "(?P<title>[^"]+)" starting (?P<start>\S+)'
tools = ["create_event"]
specificity = 10
[[rule.call]]
name = "create_event"
arguments = { title = "${title}", start = "${start}" }

# ---- after a tool result ------------------------------------------------------------------------------------

[[rule]]
name = "weather-result"
match = '"temp_c"\s*:\s*(?P<t>-?\d+)(?:.*?"sky"\s*:\s*"(?P<sky>[^"]+)")?'
on = "tool"
specificity = 10
reasoning = "The tool gave the temperature."
content = "It is ${t} °C there right now."

[[rule]]
name = "tool-result"
match = '(?s)^(?P<out>.{1,200})'
on = "tool"
content = "The tool returned: ${out}"

# ---- formats -------------------------------------------------------------------------------------------------

[[rule]]
name = "json-object"
match = 'Respond with only a JSON object'
specificity = 5
content = '{"name": "Ada Lovelace", "age": 36}'

[[rule]]
name = "python-function"
match = '(?i)python function (?:that|to|which) (?P<what>[^.?!]+)'
specificity = 5
reasoning = "A small function with a docstring."
content = """```python
def solution(*args):
    \"\"\"${what}.\"\"\"
    raise NotImplementedError
```"""

[[rule]]
name = "story"
match = '(?i)write (?:me )?a (?:short )?story'
specificity = 5
content = "The lighthouse keeper climbed the stairs again, as he had every night for thirty years. "
fill = true

[[rule]]
name = "explain"
match = '(?i)^(?:explain|what is|what are) (?P<topic>[^?.]+)'
specificity = -1
content = "${topic} is a topic the pseudo engine knows nothing about, but here is a confident sentence about it."
