# Qwen3.8-Flash-Next runtime settings. knobs/README.md describes the fields.
prefix: "GR8_QW38_"
knobs:
  GR8_QW38_PROFILE:
    scope: local
    kind: flag
    default: "0"
    values: "0|1"
    legacy: []
    doc: >-
      1 = record CUDA event timings per component (HC, GDN, Full Attn+QSA, MoE, PLE I/O, PLE GPU, AllReduce, Head)
      and print a summary breakdown on rank 0 at the end of a standalone run. 0 (the default) = off.
  GR8_QW38_PLE_CACHE_MIB:
    scope: local
    kind: int
    default: "1024"
    values: "0..131072"
    legacy: []
    doc: >-
      RAM LRU cache size in MiB for the Layer-1 PLE NVMe rowstore (raw exlr8-ple-L001.bin or exlr8 row-trellis
      safetensors). 0 disables caching and reads every row directly from NVMe. For row-trellis tables whose compressed
      rows fit within this budget, the rows tensor is mmap-resident with zero NVMe I/O. Default: 1024 MiB.
  GR8_QW38_PLE_PATH:
    scope: local
    kind: path
    unset: "use <release>/ple/exlr8-ple-L001.bin if present, else auto-detect row-trellis safetensors under <release>/ple/"
    legacy: []
    doc: >-
      Optional path to the Layer-1 PLE embedding table (raw BF16 .bin or exlr8 FORMAT v4 record-9 row-trellis
      .safetensors). When unset, raw ple/exlr8-ple-L001.bin is used if present; otherwise row-trellis safetensors
      (exlr8-ple-L001.{k5,k4p5,k4}.safetensors, exlr8-ple-L001.safetensors, rows.safetensors) are auto-detected.
  GR8_QW38_FAST_AR:
    scope: agree
    kind: flag
    default: "1"
    values: "0|1"
    legacy: []
    doc: >-
      1 (the default) = on a multi-rank cluster (TP >= 2), per-rank partials cross the RDMA fabric from the device via
      device-driven collectives. 0 = host-staged fallback per collective. Every rank must agree.
  GR8_QW38_WIDE:
    scope: agree
    kind: flag
    default: "1"
    values: "0|1"
    legacy: []
    doc: >-
      1 (the default) = reorder K2/K3 PMCGX routed-expert weights in-place to wide-load order after loading (before
      ptab::build SCATTER) for coalesced 256-byte tile loads. 0 = stock tile order. Same output bits. Every rank must agree.
  GR8_QW38_GRAPH:
    scope: agree
    kind: flag
    default: "1"
    values: "0|1"
    legacy: []
    doc: >-
      1 (the default) = capture and replay CUDA graphs for decode steps (compatible with fixed-address GR8_PTAB=1|2
      piece tables and multi-box single-step FAST_AR). 0 = eager launches. Every rank must agree.
  GR8_QW38_PLE_ASYNC:
    scope: local
    kind: flag
    default: "1"
    values: "0|1"
    legacy: []
    doc: >-
      1 (the default) = prefetch Layer-1 PLE n-gram rows on a background thread concurrently with Layer-0 GPU execution.
      0 = synchronous PLE fetch at Layer-1 entry.
  GR8_QW38_WIDTHS:
    scope: local
    kind: path
    unset: "auto-detect manifests/exlr8-manifest-bit300.json (or bit400/bit200) in the release directory"
    legacy: []
    doc: >-
      Path to an exlr8 width manifest JSON file when --widths is not passed on the command line.
  GR8_QW38_DENSE_FP8:
    scope: agree
    kind: flag
    default: "1"
    values: "0|1"
    legacy: []
    doc: >-
      1 (the default) = quantize dense decode projections (GDN, Full Attn, HC, shared expert) in-memory on GPU at load
      time to block-32 FP8 E4M3 (with FP16 scales) for 2x lower decode memory bandwidth while keeping prefill in BF16.
      0 = keep all dense decode projections in BF16. Every rank must agree.
  GR8_QW38_MTP_FAST:
    scope: agree
    kind: flag
    default: "1"
    values: "0|1"
    legacy: []
    doc: >-
      1 (the default) = enable fast MTP drafting (2-bit block-32 draft lm_head screen with exact top-64 rescore,
      block-32 INT4 MTP L048 routed experts, and single-graph zero-host-sync K-step greedy argmax drafting for both
      greedy and sampled requests). Trunk verification is unchanged, preserving exact target sampling distributions.
      0 = fallback to FP8 draft head and per-step host sync. Every rank must agree.
  GR8_QW38_TRUNK_HEAD2:
    scope: agree
    kind: flag
    default: "1"
    values: "0|1"
    legacy: []
    doc: >-
      1 (the default) = accelerate trunk decode/verify lm_head (M <= 48) with a 2-bit block-32 full-vocab screen
      followed by bit-exact FP8 rescore of the top-256 candidates (reusing the MTP 2-bit head table at zero extra VRAM
      when MTP > 0). 0 = full-vocab FP8 lm_head. Every rank must agree.
  GR8_QW38_PF_MXFP8:
    scope: agree
    kind: flag
    default: "1"
    values: "0|1"
    legacy: []
    doc: >-
      1 (the default) = quantize trunk GDN, Full Attn (Q/K/V/O), and shared-MoE FP8 weights with OCP MXFP8 UE8M0
      block-32 scales (keeping exact FP16 scales on HC, lm_head, QSA indexer, and MTP) and run Blackwell native MXFP8
      Tensor Core GEMMs (m16n8k32) for M >= 16 (c4/c8 verify and prefill). 0 = FP16-scaled FP8 decode GEMV and BF16
      cuBLAS prefill. Every rank must agree.
  GR8_QW38_VISION:
    scope: agree
    kind: flag
    default: "0"
    values: "0|1"
    legacy: []
    doc: >-
      1 = load dense/vision-bf16.safetensors (Qwen4ExpVisionModel, 27-layer BF16 ViT) on every rank and accept
      multimodal image prompts with 3D MRoPE. 0 (the default) = text-only boot. Every rank must agree.
  GR8_QW38_DFL_PACK:
    scope: local
    kind: path
    unset: "QSpine-DF2 drafter disabled"
    legacy: []
    doc: >-
      Path to Qwen3.8 QSpine-DF2 drafter pack (.q4_0.pack or adapted pack). When set with GR8_QW38_DFL=1, enables
      parallel B=8 DFlash2 speculative drafting reusing PR #599's 2-bit lm_head screen and read-only GDN replay.
  GR8_QW38_DFL:
    scope: agree
    kind: flag
    default: "1"
    values: "0|1"
    legacy: []
    doc: >-
      1 (the default when GR8_QW38_DFL_PACK is set) = enable QSpine-DF2 parallel block drafter. 0 = disable and
      fall back to L048 MTP. Every rank must agree.
  GR8_QW38_DFL_DP:
    scope: agree
    kind: int
    default: "2"
    values: "0|1|2"
    legacy: []
    doc: >-
      QSpine-DF2 candidate path selection mode: 0 = stock myopic greedy walk at fixed K; 1 = Calibrated Expected-Reach
      Viterbi DP at fixed K; 2 (default) = Calibrated Expected-Reach Viterbi DP + per-round dynamic K* in 1..K maximizing
      expected tok/s = E[tau(K)] / (T_draft + T_verify(K)). Every rank must agree.
  GR8_QW38_DFL_K:
    scope: agree
    kind: int
    default: "7"
    values: "1..7"
    legacy: []
    doc: >-
      Maximum draft prefix length verified per QSpine-DF2 round (1..7; the drafter always executes its frozen
      bidirectional B=8 block forward and truncates only proposals/verify). Every rank must agree.
  GR8_QW38_NO_MTP:
    scope: agree
    kind: flag
    default: "0"
    values: "0|1"
    legacy: []
    doc: >-
      1 = omit loading Layer-48 MTP weights and KV pages (saves ~4-6 GB VRAM in QSpine-DF2-only mode).
      0 (the default) = load Layer-48 MTP when --mtp > 0. Every rank must agree.
  GR8_QW38_TAP_DUMP:
    scope: local
    kind: path
    unset: "off"
    legacy: []
    doc: >-
      Optional output path for inline contiguous 5-layer HC-mean tap + greedy target capture (.qtap stream).
  GR8_QW38_PLE_RAM:
    scope: local
    kind: flag
    default: "0"
    values: "0|1"
    legacy: []
    doc: >-
      1 = copy a GGUF IQ4_NL Layer-1 PLE table into anonymous transparent-hugepage RAM at load time instead of
      file-backed mmap (immune to page-cache reclaim). 0 (the default) = file-backed mmap.
  GR8_QW38_PLE_NO_WARM:
    scope: local
    kind: flag
    default: "0"
    values: "0|1"
    legacy: []
    doc: >-
      1 = skip the 4-thread sequential page-cache warm-up pass when mmap-loading a GGUF IQ4_NL Layer-1 PLE table.
      0 (the default) = warm the mapped pages at load time.
  GR8_QW38_STRATA:
    scope: local
    kind: flag
    default: "0"
    values: "0|1"
    legacy: []
    doc: >-
      1 = enable single-GPU Strata mode (pinned UVA host-RAM routed experts, adaptive VRAM expert cache, stage_slab
      aliasing, and optional AVX-512 K3 CPU MoE offload). 0 (the default) = standard VRAM-resident loading.
  GR8_QW38_VRAM_RESERVE_MIB:
    scope: local
    kind: int
    default: "1920"
    values: "0.."
    legacy: []
    doc: >-
      VRAM headroom in MiB left free after sizing the Strata-mode VRAM routed-expert cache pool.
  GR8_QW38_EXPERT_CACHE_SLOTS:
    scope: local
    kind: int
    default: "-1"
    values: "-1.."
    legacy: []
    doc: >-
      Override total Strata-mode VRAM expert cache slots (-1 = auto-size from free VRAM minus reserve).
  GR8_QW38_EXPERT_PROFILE:
    scope: local
    kind: path
    unset: "round-robin initial expert fill"
    legacy: []
    doc: >-
      Optional path to a Strata STRP v1 expert frequency profile used to rank initial VRAM expert placement and
      static core pinning.
  GR8_QW38_ADAPTIVE:
    scope: local
    kind: flag
    default: "1"
    values: "0|1"
    legacy: []
    doc: >-
      1 (the default) = enable adaptive heat-based VRAM expert cache promotion/eviction in Strata mode.
      0 = keep the initial expert placement static.
  GR8_QW38_PROMOTE_ASYNC:
    scope: local
    kind: flag
    default: "1"
    values: "0|1"
    legacy: []
    doc: >-
      1 (the default) = asynchronously H2D-promote hot experts into ring slots on the dedicated transfer stream in
      Strata mode. 0 = synchronous promotion.
  GR8_QW38_PROMOTE_MAX:
    scope: local
    kind: int
    default: "32"
    values: "0.."
    legacy: []
    doc: >-
      Maximum cold experts promoted per decode round in Strata mode.
  GR8_QW38_PROMOTE_HYST:
    scope: local
    kind: float
    default: "1.10"
    values: "0.."
    legacy: []
    doc: >-
      Hysteresis ratio required for a cold expert's heat score to evict the coldest dynamic VRAM resident in Strata mode.
  GR8_QW38_HEAT_DECAY:
    scope: local
    kind: float
    default: "0.94"
    values: "0..1"
    legacy: []
    doc: >-
      Per-step exponential decay factor applied to Strata-mode expert heat counters.
  GR8_QW38_HEAT_CAP:
    scope: local
    kind: float
    default: "16.0"
    values: "0.."
    legacy: []
    doc: >-
      Maximum dynamic heat value for an expert in Strata mode so stale sessions do not lock out new ones.
  GR8_QW38_MIN_PROMOTE_HEAT:
    scope: local
    kind: float
    default: "1.5"
    values: "0.."
    legacy: []
    doc: >-
      Minimum heat score before a cold expert is eligible for Strata-mode VRAM promotion.
  GR8_QW38_STATIC_PIN_FRAC:
    scope: local
    kind: float
    default: "0.20"
    values: "0..1"
    legacy: []
    doc: >-
      Fraction of profile-ranked Strata VRAM cache slots pinned as a static core immune to eviction.
  GR8_QW38_PF_STAGE_EXPS:
    scope: local
    kind: int
    default: "32"
    values: "1.."
    legacy: []
    doc: >-
      Number of cold experts per double-buffered H2D staging batch during Strata-mode prefill.
  GR8_QW38_PF_D2D_PROMOTE:
    scope: local
    kind: int
    default: "64"
    values: "0.."
    legacy: []
    doc: >-
      Maximum cold experts per layer promoted via zero-PCIe device-to-device copy from the prefill staging buffer in
      Strata mode.
  GR8_QW38_PF_WARM_HEAT:
    scope: local
    kind: flag
    default: "1"
    values: "0|1"
    legacy: []
    doc: >-
      1 (the default) = warm Strata expert heat scores during prompt prefill. 0 = update heat only during decode.
  GR8_QW38_CPU_MOE:
    scope: local
    kind: flag
    default: "1"
    values: "0|1"
    legacy: []
    doc: >-
      1 (the default) = enable hybrid AVX-512 BF16/VBMI2 CPU K3 cold-expert offload in Strata mode on x86-64 hosts
      supporting AVX-512 BF16/VBMI2. 0 = run all cold experts on GPU over UVA/PCIe.
  GR8_QW38_CPU_THREADS:
    scope: local
    kind: int
    default: "14"
    values: "0..256"
    legacy: []
    doc: >-
      Worker thread count for Strata-mode hybrid CPU K3 MoE offload.
  GR8_QW38_CPU_FRAC:
    scope: local
    kind: float
    default: "0.70"
    values: "0..1"
    legacy: []
    doc: >-
      Fraction of decode cold experts dispatched to the Strata CPU K3 MoE worker pool in parallel with GPU PCIe.
  GR8_QW38_PF_CPU_MAX_M:
    scope: local
    kind: int
    default: "512"
    values: "0.."
    legacy: []
    doc: >-
      Maximum prefill chunk size M for Strata-mode hybrid CPU cold-expert offload.
  GR8_QW38_PF_CPU_FRAC:
    scope: local
    kind: float
    default: "0.55"
    values: "0..1"
    legacy: []
    doc: >-
      Fraction of small-prefill cold experts dispatched to the Strata CPU K3 MoE worker pool.
