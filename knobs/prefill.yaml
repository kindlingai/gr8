# Prefill. knobs/README.md describes the fields.
prefix: "GR8_"
knobs:
  GR8_FPF_ATTN_P1:
    scope: agree
    kind: flag
    default: "0"
    doc: >-
      Flash prefill attention runs the P1 bodies instead of the GEMM bodies.
  GR8_FPF_DSA_P1:
    scope: agree
    kind: flag
    default: "0"
    doc: >-
      Flash prefill DSA layers run the P1 bodies instead of the GEMM bodies.
  GR8_FPF_P1:
    scope: agree
    kind: flag
    default: "0"
    doc: >-
      Flash prefill runs the P1 bodies everywhere, the reference the GEMM bodies are checked against.
  GR8_PF_ADUMP:
    scope: local
    kind: path
    unset: "unset"
    doc: >-
      On the first prefill call of layer position 0, each rank writes diagnostic buffers to DIR/<name>.r<rank>.bin.
      Synchronizes.
  GR8_PF_AOP:
    scope: agree
    kind: flag
    unset: "1 when built with -DPF_AOP"
    values: "0|1"
    doc: >-
      0 turns off the prefill fc1 A-operand share, which quantizes the fc1 A operand once into records the fc1 CTAs
      stage. Byte-exact. Needs the -DPF_AOP build.
  GR8_PF_AOP_MMIN:
    scope: agree
    kind: int
    default: "3072"
    doc: >-
      Sets the fewest rows a prefill fc1 pass needs to use the A-operand share. Smaller passes run the stock fc1, with
      the same bytes.
  GR8_PF_ATTN_ROWS:
    scope: agree
    kind: int
    unset: "the whole sub-batch (the GLM launcher sets 1024)"
    doc: >-
      Prefill attention runs in chunks of this many rows inside a sub-batch. The rest of the layer runs at the sub-
      batch size.
  GR8_PF_BLAS_ROWS:
    scope: agree
    kind: int
    unset: "the whole sub-batch (the GLM launcher sets 1024)"
    values: "16.."
    doc: >-
      Runs the prefill cuBLAS calls in chunks of this many rows, so a row's bits depend on its chunk and not on the
      sub-batch size.
  GR8_PF_DENSE:
    scope: agree
    kind: int
    default: "8192"
    values: "0..2147483616"
    doc: >-
      Sets the context up to which prefill attention takes the dense path. Past it the sparse, indexer-selected path
      runs. 0 means always sparse.
  GR8_PF_DRAFT_SHARE:
    scope: agree
    kind: int
    unset: "on when the target has tensor-core prefill states"
    values: "0|1"
    doc: >-
      The MTP draft prefill borrows the target prefill's tensor-core attention scratch instead of its own, about 2 GB a
      rank. 1 requires it, 0 gives the draft its own.
  GR8_PF_DTR8:
    scope: agree
    kind: flag
    default: "0"
    values: "0|1"
    doc: >-
      Flash prefill runs the dense trellis matrices from FP8 tile copies made once at load (`dtr_find.h`) instead of the
      fp16 trellis-tile GEMM.
  GR8_PF_EVENTS:
    scope: local
    kind: flag
    default: "0"
    values: "0|1"
    doc: >-
      GLM prefill attention allocates and records CUDA timing events per query tile (`attn/prefill.h`). Other values
      make the attention state fail to create.
  GR8_PF_F12:
    scope: agree
    kind: flag
    unset: "1 when built with -DPF_F12"
    values: "0|1"
    doc: >-
      0 runs the stock prefill fc1 instead of the fat-CTA `k_pf_fc1f`, where adjacent expert blocks share one quantized
      A record (byte-exact).
  GR8_PF_FC2ONE:
    scope: agree
    kind: flag
    default: "1"
    values: "0|1"
    doc: >-
      0 makes the Flash fp16 MoE fc2 run one output Hadamard per block instead of one per 128-column group.
  GR8_PF_FC2V2:
    scope: agree
    kind: flag
    default: "1"
    values: "0|1"
    doc: >-
      0 runs the Flash prefill fc2 as `k_pf_fc2g` instead of `k_pf_fc2v`, which stages A and weights in shared memory.
  GR8_PF_GEMMF32:
    scope: agree
    kind: flag
    default: "1"
    values: "0|1"
    doc: >-
      0 keeps big FP32-output prefill GEMMs (the row-owner QO o_proj) on the guarded `k_gemm_mx8b` instead of the
      unguarded `k_gemm_mx8f`. Same bits either way.
  GR8_PF_GEMMG:
    scope: agree
    kind: int
    default: "8"
    doc: >-
      Sets how many row blocks `k_gemm_mx8f` full-M launches group in their raster order, and 0 or 1 gives a plain
      raster. Launch order only, same bits.
  GR8_PF_HASH:
    scope: local
    kind: flag
    default: "0"
    values: "0|1"
    doc: >-
      Flash prefill prints a hash of each sub-batch's residual rows (stream sync, copy to host, FNV) on its `prefill
      rows` line.
  GR8_PF_HASH_GPU:
    scope: agree
    kind: flag
    default: "0"
    values: "0|1"
    doc: >-
      The per-sub-batch residual hash is a splitmix64 sum computed on the GPU instead of an FNV of the rows on the host,
      which gives a different value.
  GR8_PF_HEAD:
    scope: local
    kind: flag
    default: "0"
    values: "0|1"
    doc: >-
      With GR8_LOGIT_DUMP set, Flash prefill also runs the head on the prompt rows and writes their logits to the dump.
  GR8_PF_HX:
    scope: agree
    kind: flag
    default: "1"
    values: "0|1"
    doc: >-
      0 makes the Flash MoE fc1 rotate x per CTA instead of reading rows rotated and scaled once per token by `k_pf_hx`.
  GR8_PF_HXF:
    scope: agree
    kind: flag
    default: "1"
    values: "0|1"
    doc: >-
      0 runs `k_pf_hx` and `k_pf_hxq` as two passes on GR8_PF_Q8 layers instead of the fused `k_pf_hxqf`.
  GR8_PF_IDDUMP:
    scope: local
    kind: path
    unset: "unset"
    doc: >-
      Rank 0 writes the ordered index IDs and positions of the first, middle and last full-index layers of each prefill
      sub-batch to this directory.
  GR8_PF_ISGRT_RG:
    scope: agree
    kind: int
    default: "8"
    values: "8.."
    doc: >-
      Sets the rows per CTA of the prefill index-score kernel, rounded down to a multiple of 8 (below 8 means 8). Same
      bits.
  GR8_PF_MOE8:
    scope: agree
    kind: flag
    default: "0"
    values: "0|1"
    doc: >-
      1 runs the Flash prefill MoE on MXFP8 activations instead of the fp16 passes, and turns on the shared expert's FP8
      copy unless GR8_PF_SHFP8 says otherwise.
  GR8_PF_OWN:
    scope: agree
    kind: int
    default: "0"
    values: "0|1|2|3|4"
    doc: >-
      Sets row-owner prefill: 1 = owners compute the next layer's projections, 2 = also the indexer, 3 = owners run all
      heads of their rows (QO pack), 4 = TP4 pair-owner QO.
  GR8_PF_OWNPERM:
    scope: agree
    kind: flag
    default: "0"
    values: "0|1"
    doc: >-
      With GR8_PF_OWN=3, interleaves the QO owner rows in 16-row blocks instead of contiguous row ranges.
  GR8_PF_PDUMP:
    scope: local
    kind: path
    unset: "unset"
    doc: >-
      Each rank writes the IDs, attention probabilities and index scores of selected prefill rows and layers to this
      directory (`pf_pdump`).
  GR8_PF_PDUMP_EVERY:
    scope: local
    kind: int
    default: "32"
    doc: >-
      With GR8_PF_PDUMP, dumps the rows whose position is a multiple of this number.
  GR8_PF_PDUMP_LAYERS:
    scope: local
    kind: ints
    default: "0,3,20,34,55,74"
    doc: >-
      With GR8_PF_PDUMP, the comma list of model layers to dump, plus their index-score source layers.
  GR8_PF_PROF:
    scope: local
    kind: int
    default: "0"
    values: "0..2"
    doc: >-
      1: prefill synchronizes after each stage and every rank prints a per-stage time profile (ms) to stderr when the
      engine exits; needs GR8_PF_STREAMS=1. 2 (GLM-5.3): a CUDA event per stage on each lane's stream instead, so it
      runs at production settings, GR8_PF_STREAMS=2 included; each rank also prints a "# pfx" line per prefill chunk
      and lane. The exit totals print only when main returns: stop the engine through the serve directory's quit
      file, which every rank honours within about 20 s.
  GR8_PF_PROF_TIMELINE:
    scope: local
    kind: int
    default: "0"
    values: "0.."
    doc: >-
      With GR8_PF_PROF=2, rank 0 prints every stage mark of the first this many two-lane chunks as "# pfxtl chunk lane
      stage ms", the ms counted from the chunk's start on one clock for both lanes, for a timeline of the lanes.
  GR8_PF_Q8:
    scope: agree
    kind: flag
    default: "0"
    values: "0|1"
    doc: >-
      1 runs the Flash routed fc1 on MXFP8 activations quantized once per token and layer instead of fp16 (not byte-
      equal to the fp16 path).
  GR8_PF_QO:
    scope: agree
    kind: text
    default: "b"
    values: "b|v1|r1"
    doc: >-
      Selects the QO attention kernel for GR8_PF_OWN=3 and 4: b, v1 or r1. Other values make the QO state fail to
      create.
  GR8_PF_QP_CTX:
    scope: agree
    kind: int
    unset: "the KV cap"
    values: "1.."
    doc: >-
      With GR8_PF_OWN=4 and GR8_PF_QP_ROLL, sets the QO key-table size in positions, and a request whose prompt plus
      generation is longer runs GR8_PF_OWN=2.
  GR8_PF_QP_EARLY:
    scope: agree
    kind: int
    default: "0"
    values: "0|1|2"
    doc: >-
      With GR8_PF_OWN=4: 1 sends the counterpart's partial before the own rows' o_proj, 2 also splits the QO call in
      two.
  GR8_PF_QP_LAYERS:
    scope: agree
    kind: text
    unset: "all"
    doc: >-
      With GR8_PF_OWN=4, the comma list of model layers and ranges that run pair-owner attention, while the others run
      GR8_PF_OWN=2.
  GR8_PF_QP_MIN:
    scope: agree
    kind: int
    default: "768"
    doc: >-
      With GR8_PF_OWN=4, a prompt shorter than this many tokens runs GR8_PF_OWN=2, and 0 sends every request that fits
      GR8_PF_QP_CTX through OWN=4.
  GR8_PF_QP_ROLL:
    scope: agree
    kind: int
    default: "0"
    values: "0|2|3|4"
    doc: >-
      With GR8_PF_OWN=4, builds the pair weights per layer in this many rolling slots from the rank pack and the
      partner's half over RDMA. 0 uses a resident --qp-pack.
  GR8_PF_QP_ROLL_SER:
    scope: local
    kind: flag
    default: "0"
    values: "0|1"
    doc: >-
      Measurement: 1 builds the rolling pair-weight slots on the prefill lane stream instead of the stage stream, so the
      build time is fully exposed.
  GR8_PF_QP_WARM:
    scope: local
    kind: flag
    default: "0"
    values: "0|1"
    doc: >-
      With GR8_PF_OWN=4, warms the pair cuBLAS and MXFP8 GEMM shapes at load so the first request does not pay for them.
  GR8_PF_QP_WIRE_E:
    scope: agree
    kind: int
    unset: "1 entry; set, it needs GR8_PF_QP_ROLL"
    values: "1..4"
    doc: >-
      With GR8_PF_OWN=4 and GR8_PF_QP_ROLL, sets the entries in the RDMA ring of pair-weight half images (`qp_wire.h`).
  GR8_PF_RCDUMP:
    scope: local
    kind: path
    unset: "unset"
    doc: >-
      Each rank appends per-expert prefill route counts per MoE layer and sub-batch to `routes.r<rank>.jsonl` in this
      directory.
  GR8_PF_ROUTER_SPLIT:
    scope: agree
    kind: flag
    default: "0"
    values: "0|1"
    doc: >-
      1 splits the Flash prefill MoE router by rows across the ranks and exchanges the route tables on a dedicated
      fabric per lane (`flash_route_split.cuh`).
  GR8_PF_RS:
    scope: agree
    kind: flag
    default: "0"
    values: "0|1"
    doc: >-
      1 runs GLM prefill with reduce-scatter plus all-gather (five collectives) instead of all-reduce.
  GR8_PF_RSDIRECT:
    scope: agree
    kind: flag
    default: "0"
    values: "0|1"
    doc: >-
      With GR8_PF_RS=1, o_proj, the dense down GEMM and the MoE final sum write straight into the reduce-scatter send
      slot, so the put only rings the doorbell.
  GR8_PF_RSHASH:
    scope: local
    kind: flag
    default: "0"
    values: "0|1"
    doc: >-
      Measurement: with GR8_PF_RS=1, syncs the stream after each put and prints an FNV hash of every owner slice of the
      send slot.
  GR8_PF_SELX_CTX:
    scope: agree
    kind: int
    default: "53248"
    values: "32769..1048576"
    doc: >-
      Prefill index tiles of at least 32 rows at a context of at least this many tokens pick their top keys with SELX
      instead of SEL32, with the same IDs in the same order.
  GR8_PF_SHR:
    scope: agree
    kind: flag
    default: "0"
    values: "0|1"
    doc: >-
      1 runs the Flash trellis shared expert inside the routed MoE pass as extra routes instead of its own pass. Same
      bytes.
  GR8_PF_STAGGER:
    scope: local
    kind: int
    default: "0"
    doc: >-
      Lane B's prefill stream first sleeps this many microseconds, so its first work starts after lane A's. Writes
      nothing.
  GR8_PF_STREAMS:
    scope: agree
    kind: int
    default: "1"
    values: "1|2"
    doc: >-
      2 runs the two GLM prefill lanes on two CUDA streams, and any other value keeps one stream.
  GR8_PF_STRIPE:
    scope: agree
    kind: flag
    unset: "1 with --pf-ips2 or on a three-rank ring, else 0"
    values: "0|1"
    doc: >-
      1 splits large prefill payload writes over two rails (needs --pf-ips2 or --ips2, or a three-rank ring that uses
      the other PCIe root's device).
  GR8_PF_STRIPE_MIN:
    scope: local
    kind: int
    default: "1048576"
    values: "8192.."
    doc: >-
      With GR8_PF_STRIPE=1, the smallest prefill payload write in bytes that goes out split over the two rails.
  GR8_PF_TILE:
    scope: agree
    kind: int
    default: "256"
    values: "64|128|256"
    doc: >-
      Sets the prefill attention query tile in rows. Other values make the attention state fail to create.
  GR8_PF_TR_BM:
    scope: agree
    kind: int
    default: "16"
    values: "8|16"
    doc: >-
      Sets the row blocks per CTA of large prefill GEMMs on trellis tiles (`k_gemm_tr`): 8 or 16. Small launches take 4.
  GR8_PF_WM:
    scope: agree
    kind: flag
    default: "1"
    values: "0|1"
    doc: >-
      0 runs the Flash routed fc1 on `k_pf_fc1` instead of the weight-major `k_pf_fc1ws` for passes of at least
      GR8_PF_WM_MIN rows. Byte-equal.
  GR8_PF_WM2:
    scope: agree
    kind: flag
    default: "0"
    values: "0|1"
    doc: >-
      1 runs the Flash prefill fc2 weight-major (`k_pf_fc2w`) instead of `k_pf_fc2v` when the fc1 runs weight-major.
      Byte-equal.
  GR8_PF_WM_MIN:
    scope: agree
    kind: int
    default: "6144"
    doc: >-
      Sets the fewest rows a Flash MoE prefill pass needs before the routed fc1 runs weight-major.
