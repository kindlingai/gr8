# Inkling-2-Small runtime settings. knobs/README.md describes the fields.
prefix: "GR8_INK2_"
knobs:
  GR8_INK2_VISION:
    scope: agree
    kind: flag
    default: "0"
    values: "0|1"
    legacy: []
    doc: >-
      1 = with --serve, an Inkling-2-Small checkpoint with model.visual.* tensors activates the vision tower at boot,
      allocating its workspace and prefill staging pool before serving starts, so the engine accepts requests with
      images (hello `vision`). Without those tensors the engine serves text only. 0 (the default) leaves the vision
      tower off and allocates no vision workspace.
  GR8_INK2_FAST_ALLREDUCE:
    scope: agree
    kind: flag
    default: "1"
    values: "0|1"
    legacy: []
    doc: >-
      1 (the default) = on a cluster the per-rank partial sums of a step cross the fabric from the device: one fabric
      step per forward and per draft block, a pooled slot per collective, the kernels write the send slot, ring the
      doorbell, wait for the peers and sum in rank order, with no host copy between the layers. 0 = one host-staged
      exchange per collective. The sums are the same bytes either way. Every rank must agree.
  GR8_INK2_GPU_HEAD_PACK:
    scope: local
    kind: flag
    default: "0"
    values: "0|1"
    legacy: []
    doc: >-
      1 = a row of head logits is reduced on the device to its largest candidates, its maximum and its sum of exp, and
      only those cross to the host (up to 512 candidates a row; more fall back to the host). 0 (the default) = the
      whole row of logits is copied to the host and reduced there. The candidates and the tokens are the same.
  GR8_INK2_CUBLAS_PREFILL:
    scope: agree
    kind: flag
    default: "0"
    values: "0|1"
    legacy: []
    doc: >-
      1 = the BF16 projections of a prompt step of 32 or more consecutive rows of one session run on the cuBLAS
      tensor-core GEMM. 0 (the default) = the engine kernel at every size. The sums differ in order, so the rows can
      differ in the last bit; decode and verify steps never take this path. Every rank must agree.
  GR8_INK2_TC_PREFILL_ATTN:
    scope: agree
    kind: flag
    default: "0"
    values: "0|1"
    legacy: []
    doc: >-
      1 = the attention of a prompt step of 16 or more consecutive rows of one session scores tiles of 64 keys on the
      tensor cores, each key tile read once for all rows. 0 (the default) = the per-row kernels at every size. The
      scores are sums in another order and the probabilities are rounded for the product with V, so the rows agree
      within rounding, not bit for bit; decode and verify steps never take this path. Every rank must agree.
  GR8_INK2_VARIANT:
    scope: agree
    kind: text
    unset: "auto-detect an exlr8 manifest when native experts are absent, else native"
    legacy: []
    doc: >-
      Optional exlr8 width-manifest variant name or path (manifests/exlr8-manifest-NAME.json) used when --variant is
      not passed on the command line. Every rank must agree.
  GR8_INK2_MMA_NARROW_CTA:
    scope: local
    kind: flag
    default: "0"
    values: "0|1"
    legacy: []
    doc: >-
      1 = for BF16 engine projections with at most 56 rows and output width 17 through 4096, schedule one
      independent MMA output warp per CTA. The operands and accumulation order within each warp do not
      change. 0 (the default) uses the original multi-warp CTA.
  GR8_INK2_GRAPH:
    scope: local
    kind: flag
    default: "1"
    values: "0|1"
    legacy: []
    doc: >-
      1 (the default) = on TP=1, capture and replay CUDA graphs for decode, verify, and MTP draft steps.
      0 = launch kernels directly on the stream without CUDA graph capture.
  GR8_INK2_PROFILE:
    scope: local
    kind: flag
    default: "0"
    values: "0|1"
    legacy: []
    doc: >-
      1 = record per-stage CUDA event timings across Inkling-2 forward, commit, and MTP draft buckets and
      print periodic summaries to stderr. 0 (the default) disables profiling with zero overhead.
  GR8_INK2_PROFILE_EVERY:
    scope: local
    kind: int
    default: "20"
    values: "1.."
    legacy: []
    doc: >-
      Number of profiled step flushes between periodic stderr reports when GR8_INK2_PROFILE=1.
  GR8_INK2_LOCAL_GRP:
    scope: local
    kind: flag
    default: "0"
    values: "0|1"
    legacy: []
    doc: >-
      1 = use the grouped GQA local-attention kernel that shares each KV read across the query heads in a
      group. 0 (the default) uses the per-query-head local-attention kernel.
  GR8_INK2_STOCK_MSG_GATE:
    scope: agree
    kind: flag
    default: "0"
    values: "0|1"
    legacy: []
    doc: >-
      1 = replay the stock serial-rank loop message-gate kernel instead of the batched rank-64 fast path.
      0 (the default) uses the batched rank-64 message-gate kernels. Every rank must agree.
  GR8_INK2_MSG_PREFILL_FUSE:
    scope: agree
    kind: flag
    default: "0"
    values: "0|1"
    legacy: []
    doc: >-
      1 = on looped checkpoints with rank-64 message gates and M > 64 rows, run the fused apply+norm kernel
      instead of separate BF16 projections and finish pass. 0 (the default) uses the split path for M > 64.
      Every rank must agree.
  GR8_INK2_MTP_ATTN_GRP:
    scope: local
    kind: flag
    default: "1"
    values: "0|1"
    legacy: []
    doc: >-
      1 (the default) = use the grouped block-attention kernel during MTP draft steps when group and block
      sizes fit. 0 = fall back to the per-query-head MTP attention kernel.
  GR8_INK2_FAST_GEMV:
    scope: local
    kind: flag
    default: "0"
    values: "0|1"
    legacy: []
    doc: >-
      1 = use the 1-warp multi-row BF16 GEMV kernel for aligned small-M projections (M <= 64). 0 (the
      default) uses the standard MMA projection path.
  GR8_INK2_GEMM_C128:
    scope: local
    kind: flag
    default: "1"
    values: "0|1"
    legacy: []
    doc: >-
      1 (the default) = use the 128B-coalesced shared-memory BF16 MMA GEMM kernel (k_ink2_gemm_c128) for
      aligned projections. 0 = use the original BF16 MMA kernel.
  GR8_INK2_FUSED_QKV:
    scope: local
    kind: flag
    default: "1"
    values: "0|1"
    legacy: []
    doc: >-
      1 (the default) = fuse Q/K/V and related multi-target BF16 projections into a single kernel launch
      reading input rows once. 0 = launch each projection separately.
  GR8_INK2_SPLITK:
    scope: local
    kind: flag
    default: "1"
    values: "0|1"
    legacy: []
    doc: >-
      1 (the default) = enable deterministic Split-K reduction on small-N BF16 projections and MoE routing
      scores. 0 = disable Split-K.
  GR8_INK2_FAST_ROUTER:
    scope: local
    kind: flag
    default: "1"
    values: "0|1"
    legacy: []
    doc: >-
      1 (the default) = use the fast coalesced router score and expert-plan kernels. 0 = use the baseline
      router and plan kernels.
  GR8_INK2_TR3_WIDE:
    scope: local
    kind: flag
    default: "1"
    values: "0|1"
    legacy: []
    doc: >-
      1 (the default) = enable the wide exlr8 tr3 pmcgx MoE fc1/fc2 path with pre-rotated activations.
      0 = fall back to the baseline tr3 MoE kernels.
  GR8_INK2_FAST_GREEDY_HEAD:
    scope: local
    kind: flag
    default: "1"
    values: "0|1"
    legacy: []
    doc: >-
      1 (the default) = on TP=1 greedy steps with GPU head packing enabled, compute exact argmax directly on
      the device without packing candidate lists. 0 = use the standard GPU head-pack path.
  GR8_INK2_BATCH_COMMIT:
    scope: local
    kind: flag
    default: "1"
    values: "0|1"
    legacy: []
    doc: >-
      1 (the default) = commit KV cache and short-conv history across all layers in a single batched kernel
      launch. 0 = launch per-layer commit kernels.
  GR8_INK2_MTP_FAST_ARGMAX:
    scope: local
    kind: flag
    default: "1"
    values: "0|1"
    legacy: []
    doc: >-
      1 (the default) = use the half-warp monotonic-argmax fold kernel for greedy MTP draft selection.
      0 = use the standard MTP head reduction.
  GR8_INK2_MTP_INT8_LM:
    scope: agree
    kind: flag
    default: "1"
    values: "0|1"
    legacy: []
    doc: >-
      1 (the default) = quantize MTP drafter body and LM head weights to per-row INT8 at load time for
      faster speculative drafting (drafter-only; trunk verification remains exact). 0 = keep MTP weights in
      BF16. Every rank must agree.
  GR8_INK2_DFLASH2:
    scope: local
    kind: path
    unset: "auto-discover <model_dir>/dflash2-melded.safetensors on TP=1 when --mtp > 0; set 0 or off to force built-in MTP"
    legacy: []
    doc: >-
      Optional path to a DFlash2 parallel block drafter safetensors file (pre-quantized melded Q4_0/Q8_0 or BF16)
      for Inkling-2-Mini on TP=1 with --mtp > 0. Set to 0 or off to disable auto-discovery and use built-in MTP.
  GR8_INK2_DF2_Q8:
    scope: local
    kind: flag
    default: "0"
    values: "0|1"
    legacy: []
    doc: >-
      When loading a BF16 DFlash2 checkpoint, 0 (the default) quantizes body weights to Q4_0 (__dp4a) for peak
      decode speed, and 1 quantizes to Q8_0. Pre-quantized melded DFlash2 packs use their stored format directly.
  GR8_INK2_DF2_HEAD2:
    scope: local
    kind: flag
    default: "1"
    values: "0|1"
    legacy: []
    doc: >-
      1 (the default) = use the 2-bit shortlist screen plus exact BF16 top-64 rescore for the DFlash2 draft LM
      head (sharing target lm_head weights). 0 = full BF16 cuBLAS draft LM head.
  GR8_INK2_DF2_DP:
    scope: local
    kind: flag
    default: "0"
    values: "0|1"
    legacy: []
    doc: >-
      0 (the default) = greedy bilinear candidate selector walk in DFlash2. 1 = calibrated expected-reach Viterbi
      DP path selection across the K x 16 candidate lattice.
  GR8_INK2_DF2_GRAPH:
    scope: local
    kind: flag
    default: "1"
    values: "0|1"
    legacy: []
    doc: >-
      1 (the default) = capture and replay per-session-count (S = 1..8) CUDA graphs for DFlash2 block drafting.
      0 = eager launches.
  GR8_INK2_DF2_EMBNORM:
    scope: local
    kind: flag
    default: "1"
    values: "0|1"
    legacy: []
    doc: >-
      1 (the default) = apply target embed_norm when embedding DFlash2 input tokens. 0 = raw target embeddings.
  GR8_INK2_DF2_SEL_ALPHA:
    scope: local
    kind: float
    default: "1.0"
    legacy: []
    doc: >-
      Bilinear candidate-selector correction scale alpha applied before final logit softcapping in DFlash2.
  GR8_INK2_PF_MX8_MOE:
    scope: agree
    kind: int
    default: "2"
    values: "0..4"
    legacy: []
    doc: >-
      Blackwell (sm_120+) grouped MXFP8 MoE prefill for exlr8 tr3 layers on TP=1 when M >= GR8_INK2_PF_MX8_MIN_M:
      4 = layer-wise 2-slot double-buffered MXFP8 scratch (~2.0 GiB, overlapped with MoE GEMM and attention),
      3 = layer-wise 1-slot streaming MXFP8 scratch (~1.0 GiB, overlapped with attention; ideal for 32 GB GPUs),
      2 (the default) = cached MXFP8 on all physical layers (~23.5 GiB; ideal for 128 GB systems),
      1 = cached MXFP8 on looped core layers only, 0 = off.
      Automatically disabled on pre-Blackwell GPUs. Decode/verify stays W*A16 exlr8 trellis. Every rank must agree.
  GR8_INK2_PF_MX8_MIN_M:
    scope: agree
    kind: int
    default: "128"
    values: "16..8192"
    legacy: []
    doc: >-
      Minimum step row count M to dispatch cached grouped MXFP8 MoE prefill when GR8_INK2_PF_MX8_MOE > 0.
      Every rank must agree.
  GR8_INK2_MX8_DENSE:
    scope: agree
    kind: int
    default: "2"
    values: "0..2"
    legacy: []
    doc: >-
      Blackwell (sm_120+) MXFP8 dense attention projections on TP=1: 0 = BF16 always, 1 = MXFP8 at all M,
      2 (the default) = MXFP8 on prefill (M >= 64) and BF16 on decode/verify (M < 64) for lowest decode KL
      and full prefill throughput. Automatically disabled on pre-Blackwell GPUs. Every rank must agree.
  GR8_INK2_MX8_LM_HEAD:
    scope: agree
    kind: int
    default: "0"
    values: "0..2"
    legacy: []
    doc: >-
      Blackwell (sm_120+) MXFP8 trunk LM head on TP=1: 0 (the default) = BF16 always, 1 = MXFP8 at all M,
      2 = MXFP8 for M >= 64 only. Automatically disabled on pre-Blackwell GPUs. Every rank must agree.
  GR8_INK2_MX8_TC_MIN_M:
    scope: local
    kind: int
    default: "9"
    values: "1..64"
    legacy: []
    doc: >-
      Row threshold where MXFP8 dense projections switch from coalesced E4M3 GEMV (M < threshold) to Blackwell
      m16n8k32 MXFP8 Tensor Core MMA (M >= threshold).
  GR8_INK2_PF_FAST_ATTN:
    scope: agree
    kind: flag
    default: "1"
    values: "0|1"
    legacy: []
    doc: >-
      1 (the default) = use the 64-Q-row overlapped-SMEM single-BF16 p@v prefill attention kernel when
      GR8_INK2_TC_PREFILL_ATTN=1, M >= 32, and GQA <= 3. 0 = stock 16-Q-row tensor-core prefill attention.
      Every rank must agree.
  GR8_INK2_DEC_FAST_ATTN:
    scope: local
    kind: flag
    default: "1"
    values: "0|1"
    legacy: []
    doc: >-
      1 (the default) = use the coalesced warp-per-head decode/verify attention kernel with transposed
      rel_proj_t for head_dim == 128. 0 = stock decode attention kernel.
  GR8_INK2_FAST_RES:
    scope: local
    kind: flag
    default: "1"
    values: "0|1"
    legacy: []
    doc: >-
      1 (the default) = use the 1-pass dynamic-SMEM zero-spill vectorized depth-attention kernels for Inkling-2.
      0 = stock multi-pass depth-attention kernels.
  GR8_INK2_MSG_BF16:
    scope: agree
    kind: flag
    default: "1"
    values: "0|1"
    legacy: []
    doc: >-
      1 (the default) = compute looped message-gate forget/gain projections in BF16 with the zero-spill SMEM
      finish kernel for M > 64. 0 = FP32 forget/gain projections. Every rank must agree.
  GR8_INK2_S2_COST:
    scope: agree
    kind: floats
    unset: "Inkling-2-Mini calibrated defaults (17.0,2.2,2.2,0.35,0.0,0.0)"
    legacy: []
    doc: >-
      Optional 6-float override (main0,main_row,draft0,draft_sess,chain0,chain_sess) for the GR8_S2_ADAPT=1
      speculative cost model in Inkling-2 builds. Every rank must agree.
