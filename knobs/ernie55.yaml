# ERNIE-5.5-Flash-Preview (`Ernie5_5_MoeForCausalLM`) runtime settings. knobs/README.md describes the fields.
prefix: "GR8_ERNIE55_"
knobs:
  GR8_ERNIE55_KV_FORMAT:
    scope: agree
    kind: text
    default: "fp8"
    values: "bf16|fp8|int4"
    legacy: []
    doc: >-
      MLA-DSA paged KV cache format for ERNIE 5.5 Flash (6 DSA layers: L7, 14, 21, 28, 35, 42): bf16 (lossless),
      fp8 (E4M3 per-32 block scales + FP8 indexer keys, default), or int4 (KV4 per-32 block scales + FP8 indexer keys).
  GR8_ERNIE55_MX8_DENSE:
    scope: agree
    kind: flag
    default: "1"
    legacy: []
    doc: >-
      Quantize ERNIE 5.5 Flash dense BF16 linear projections to Blackwell MXFP8 (E4M3 + UE8M0 1x32 scales) at boot
      and free the ~11.34 GiB BF16 dense staging slab before KV and hot-expert allocation, saving ~5.4 GiB VRAM and
      halving decode dense bandwidth. Set 0 to keep all dense weights in BF16.
  GR8_ERNIE55_MX8_HEAD:
    scope: agree
    kind: flag
    default: "0"
    legacy: []
    doc: >-
      Quantize ERNIE 5.5 Flash lm_head.weight [201216, 4096] to Blackwell MXFP8 (E4M3 + UE8M0 1x32 scales) at boot,
      halving LM-head decode bandwidth (~7.1 ms -> ~3.6 ms on Spark). Default 0 keeps lm_head in lossless BF16.
  GR8_ERNIE55_GRAPHS:
    scope: local
    kind: flag
    default: "1"
    legacy: []
    doc: >-
      Capture and replay CUDA Graphs for resident (non-hybrid) TP=1 small-batch decode steps (M <= 12). Set 0 for
      eager kernel launches.
  GR8_ERNIE55_HYBRID:
    scope: local
    kind: flag
    default: "0"
    legacy: []
    doc: >-
      Enable single-GPU hybrid VRAM hot-expert cache + reclaimable file-backed MAP_SHARED host RAM offload for
      routed experts and embed.weight (32 GB RTX 5090 + 128 GB host RAM). Set 0 for full GPU-resident mode (Spark).
  GR8_ERNIE55_VRAM_RESERVE_MIB:
    scope: local
    kind: int
    default: "1024"
    values: "128.."
    legacy: []
    doc: >-
      VRAM headroom in MiB left free after carving the ERNIE 5.5 hybrid hot-expert cache pool.
  GR8_ERNIE55_EXPERT_CACHE_SLOTS:
    scope: local
    kind: int
    default: "-1"
    values: "-1.."
    legacy: []
    doc: >-
      Override total dynamic VRAM hot-expert cache slots in hybrid mode (-1 auto-sizes from free VRAM minus reserve).
  GR8_ERNIE55_EXPERT_PROFILE:
    scope: local
    kind: path
    unset: "no static STRP expert pinning"
    legacy: []
    doc: >-
      Optional path to a STRP v1 routing-frequency profile file used to pin the hottest routed experts into the
      tight-packed static VRAM core in hybrid mode.
  GR8_ERNIE55_HYBRID_ADAPTIVE:
    scope: local
    kind: flag
    default: "1"
    legacy: []
    doc: >-
      Enable adaptive heat-based dynamic expert promotion into the VRAM hot-expert cache in hybrid mode.
  GR8_ERNIE55_HYBRID_PROMOTE_MAX:
    scope: local
    kind: int
    default: "8"
    values: "0..64"
    legacy: []
    doc: >-
      Maximum number of cold routed experts promoted asynchronously into dynamic VRAM slots per decode step.
  GR8_ERNIE55_HYBRID_CPU_OVERLAP:
    scope: local
    kind: flag
    default: "0"
    legacy: []
    doc: >-
      Enable optional host CPU (AVX-512 / OpenMP) evaluation of overflow cold routed experts during hybrid decode
      while GPU computes VRAM-resident hot experts.
  GR8_ERNIE55_PROFILE:
    scope: local
    kind: flag
    default: "0"
    legacy: []
    doc: >-
      Print per-stage ERNIE 5.5 Flash timing summaries (mhc, hca, dsa, moe, hybrid_io, ar, head).
