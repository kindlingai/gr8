# DeepSeek-V4.1-Flash (-DG6_MODEL_DS41=1) MoE layers: the router, the shared expert and the routed experts. knobs/README.md
# describes the fields.
prefix: "GR8_DS"
knobs:
  GR8_DS_GATE_RO:
    scope: agree
    kind: flag
    default: "0"
    doc: >-
      1: the read-once prefill path computes the main layers' gate logits with k_gate_logits_ro (8 experts x 8 tokens
      per warp) instead of k_gate_logits_mt. Same fma chain per token and expert, so the logits are the same bytes. The
      128-expert draft layers keep k_gate_logits_mt.
  GR8_DS_MOE_ELOG:
    scope: local
    kind: flag
    default: "1"
    legacy: ["DS41_MOE_ELOG"]
    doc: >-
      1: every prefill router call (more than 32 rows) writes the distinct experts of each layer to a device ring that
      the host reads after the chunk. 0: no record is written.
  GR8_DS_MOE_FC1BSTG:
    scope: agree
    kind: flag
    default: "0"
    doc: >-
      1: the read-once fc1 expert loop copies its FP16 B fragments to a two-record cp.async shared ring before the same
      MMA. Every value is the same.
  GR8_DS_MOE_FC2STG:
    scope: agree
    kind: flag
    default: "0"
    doc: >-
      1: the read-once fc2 expert loop loads a group's act tile into registers in one batch and then stores it to shared
      memory, instead of one load and one store per trip. Every address and value is the same. Decode, k_fc1_ro and the
      shared expert are not touched.
  GR8_DS_MOE_L2HINT:
    scope: agree
    kind: int
    default: "0"
    values: "0..2"
    doc: >-
      An L2 evict_last hint on the routed expert weight loads of the read-once expert loop. 0: off. 1: k_fc1_ro only. 2:
      k_fc1_ro and k_fc2_ro. No activation load or store carries a hint, and decode and the shared expert are not
      touched. Every value is the same.
  GR8_DS_MOE_PDL:
    scope: agree
    kind: flag
    default: "0"
    legacy: ["DS41_MOE_PDL"]
    doc: >-
      1: the MoE kernels of a decode layer after build_xfrag launch with programmatic dependent launch. 0: plain
      launches.
  GR8_DS_MOE_PW_BOUND:
    scope: agree
    kind: flag
    default: "0"
    doc: >-
      1: the chunked prefill path (33 to 256 rows) sizes its expert-slot grid from the routes the top-k cut keeps (rows
      x GR8_DS_MOE_TOPK) instead of rows x 6. The grid only shrinks when GR8_DS_MOE_TOPK is below 6. CTAs past the
      plan's slot count exit before any work, so the output is the same.
  GR8_DS_MOE_SH_1PASS:
    scope: agree
    kind: flag
    default: "0"
    doc: >-
      1: the shared expert at 33 to 48 rows runs in one pass of 6 tiles, so it reads its weights once, instead of a loop
      over 32-row chunks.
  GR8_DS_MOE_TOPK:
    scope: agree
    kind: int
    default: "6"
    values: "1..6"
    doc: >-
      Routed experts kept per token on the main layers (384 experts). The kept routes are the planner's first picks
      (best biased key first) and their weights renormalize over the kept. The 128-expert draft layers keep their top-3.
      6 is the model's top-k. Quality below 6 is not measured.
  GR8_DS_RO_L2LA:
    scope: agree
    kind: int
    default: "0"
    values: "0..1048576"
    doc: >-
      L2 lookahead of the read-once expert loop, in CTAs. While CTA b of k_fc1_ro runs, its warp 0 prefetches into L2
      the weights of CTA b + n; k_fc2_ro (2 CTAs per SM) looks 2n ahead. A hint only: every value, order and write is
      the same. 0: off.
  GR8_DS_RO_ORDER:
    scope: agree
    kind: flag
    default: "0"
    doc: >-
      1: the read-once expert loop starts its CTA groups in the order k_order_ro computes (heavy and light experts
      merged in proportion to their work, heaviest first) instead of expert-id order. Only the start order changes, so
      every output byte is the same.
  GR8_DS_SH_TC:
    scope: agree
    kind: flag
    default: "0"
    doc: >-
      1: the shared expert of the read-once prefill path runs on the tensor-core MXFP8 GEMM (x and act quantized to E4M3
      per 32 with E8M0 scales), and the combine reads its bf16 output. Not bit-identical to 0. Decode and the chunked
      path keep the GEMV. Costs a plain copy of the shared weights per MoE layer (9,461,760 bytes) plus scratch, and
      needs the attention object's ds41_gemm_mx_tc and ds41_sh_* entries linked.
