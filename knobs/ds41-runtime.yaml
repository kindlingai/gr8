# DeepSeek-V4.1-Flash (MODEL=ds41) step driver, prefill and serving. Read only by a DS41 build.
prefix: "GR8_DS"
knobs:
  GR8_DS_PF_V2_ATTN_PIPE:
    scope: local
    kind: flag
    default: "0"
    values: "0|1"
    doc: >-
      V2 prefill only: pipeline two packed K stages in the cp.async CQ attention core, preserving bf16 operands and arithmetic order.
      Needs GR8_DS_PF_V2=1, GR8_DS_ATTN_CPA=1 and packed compressed rows (GR8_DS_COMP_FP4=1) to select the new kernel.
      Window-only, bounded replay, decode and eligible split launches stay unchanged. Mixed window/CQ blocks stay serial.
      Logs request/on once per v2 request per rank, including on=0. Default 0 keeps the original kernels.
  GR8_DS_BLOCK:
    scope: agree
    kind: text
    unset: "the checkpoint's DSpark block, 5"
    doc: >-
      DSpark draft block size; the draft step always holds 5 rows a session, so only 5 is served.
  GR8_DS_C8PACK:
    scope: agree
    kind: flag
    default: "0"
    values: "0|1"
    doc: >-
      Short fresh prompts (up to 64 rows each, up to 8 of them, 512 rows in all) prefill together in one ragged pass and
      share one prompt-tail step. Needs --serve, --s2-sessions >= 2 and GR8_DS_PREFILL_MIN >= 2.
  GR8_DS_CACHE_MIB:
    scope: local
    kind: int
    unset: "4096 MiB per rank"
    values: "1.."
    legacy: ["G6_DS41_CACHE_MIB"]
    doc: >-
      Size in MiB of the host prefix cache of DS41 session snapshots (--reuse-prefix).
  GR8_DS_CACHE_DEDUP:
    scope: agree
    kind: int
    default: "1"
    values: "0..64"
    doc: >-
      Skip a new DS41 prefix snapshot when a stored same-namespace prefix is at most this many tokens shorter.
      The default 1 reuses a stored same-namespace prefix at most one token behind the requested snapshot position. This
      includes short replies: their request end then adds no snapshot. Longer replies' snapshots follow
      GR8_DS_CACHE_REPLACE. Set 0, with GR8_DS_CACHE_REPLACE=0, to keep every snapshot. Larger values may cause short
      follow-ups to re-prefill on the next turn.
  GR8_DS_CACHE_REPLACE:
    scope: agree
    kind: flag
    default: "1"
    values: "0|1"
    doc: >-
      A request's two DS41 prefix snapshots (prompt end, request end) are linked. A first turn keeps both until its
      follow-up. The follow-up's restore of one frees the other, the unused sibling: a chat that sends the reply back
      (tools, or thinking off) continues from the request-end snapshot, a thinking chat without tools (its next prompt drops
      the reasoning) from the prompt-end one. A request that restored a request-end snapshot frees its own prompt-end one
      when it captures its request end. A freed prompt-end snapshot is lost only to prompts that share its prefix and leave
      the reply (a retry, regenerate or edit); a freed request-end snapshot (its prompt-end sibling was restored) is lost to
      a later prompt that keeps that reply after all, e.g. a turn with tools after a thinking turn without them. Those
      prompts prefill again. Set 0 (and GR8_DS_CACHE_DEDUP=0) to keep every snapshot until LRU eviction.
  GR8_DS_PARK:
    scope: agree
    kind: flag
    default: "0"
    values: "0|1"
    doc: >-
      A finished chat keeps its slot (parked) instead of being copied into the prefix cache: a follow-up whose prompt
      extends it is admitted into that slot with no restore and prefills only the new tokens. A new chat with no free
      slot evicts the oldest parked slot, captured into the prefix cache first. The prompt-end snapshot is captured as
      before. With GR8_DS_CACHE_REPLACE the eviction capture is the request-end snapshot, linked to the prompt-end one as
      at request end, and a resume frees the unused prompt-end snapshot as a request-end restore does. Needs --serve,
      --s2-sessions >= 2 and --reuse-prefix.
  GR8_DS_CONF_TEMP:
    scope: agree
    kind: text
    unset: "1.0"
    doc: >-
      Temperature of the DSpark confidence head: one positive number for every draft row, or five comma separated, one
      a row. A draft's confidence is the sigmoid of its head score over the temperature. Only GR8_DS_VERIFY_CAP reads
      the confidence; at 1.0 the scores keep their order.
  GR8_DS_DEC_STAGE:
    scope: agree
    kind: flag
    default: "0"
    values: "0|1"
    doc: >-
      Decode consumes of the main model (1..MX rows) read the peers' slots with 16-byte loads through shared memory.
  GR8_DS_ENGRAM_MTP:
    scope: agree
    kind: flag
    default: "0"
    values: "0|1"
    doc: >-
      Allows GR8_DS_ENGRAM=1 together with GR8_DS_MTP. The verify rows' n-gram window comes from the host-built step input
      and a rejected draft's ring tokens are rewritten before they are read. Not yet compared against Engram at MTP 0.
  GR8_DS_FEED_DIR:
    scope: local
    kind: path
    unset: "off"
    doc: >-
      Debug: a directory of reference activations the step driver feeds in place of its own, layer by layer.
  GR8_DS_MANIFEST:
    scope: agree
    kind: text
    unset: "native"
    doc: >-
      The release manifest the loader plans from, manifests/exlr8-manifest-NAME.json. A layer whose widths are numbers
      loads its experts as exlr8 trellis (k4: layers 0-7 and 38-39 at K4; k3: layers 0-39 at K3); the other layers keep
      the native experts.
  GR8_DS_MHC_DECOMP:
    scope: agree
    kind: flag
    default: "0"
    values: "0|1"
    legacy: ["G6_DS_B12_MHC"]
    doc: >-
      Prefill chunks above MX rows run the mHC consume and prepare as separate decomposed kernels (ds_mhc_decomp.cuh).
  GR8_DS_MHC_FUSE:
    scope: agree
    kind: flag
    default: "1"
    values: "0|1"
    doc: >-
      The mHC consume of one sub-layer and the prepare of the next run as one trunk pass, except where Engram sits
      between them. 0 runs them apart.
  GR8_DS_MHC_ROW_SHARD:
    scope: agree
    kind: flag
    default: "0"
    values: "0|1"
    doc: >-
      W-row prefill: each rank runs the late layers' mHC for a quarter of the rows and all-gathers the trunk state.
      Needs W 4096, GR8_DS_PF_TAIL 128, TP4, GR8_DS_PF_RS=1 and GR8_DS_MHC_FUSE=1.
  GR8_DS_MHC_Y_MXFP8:
    scope: agree
    kind: flag
    default: "0"
    values: "0|1"
    doc: >-
      With GR8_DS_MHC_ROW_SHARD=1, the y all-gather carries MXFP8 instead of BF16. Lossy.
  GR8_DS_MOE_TOPK_DECODE:
    scope: agree
    kind: int
    unset: "the main step's routed experts"
    values: "1..6"
    doc: >-
      Routed experts a decode step takes, below the prefill's (GR8_DS_MOE_TOPK). A screen arm, not the model.
  GR8_DS_MTP:
    scope: agree
    kind: text
    unset: "0, no drafts"
    doc: >-
      DSpark drafts verified a round, 1..5 (the checkpoint's three draft layers, block of 5). Served only.
  GR8_DS_PF_V2:
    scope: agree
    kind: flag
    default: "0"
    values: "0|1"
    doc: >-
      Experimental sequence-parallel prefill conductor for layers 0..20. Own-row residual state,
      a dedicated fabric and high-priority communication stream; late layers remain on the stock path.
      Needs TP4, one prefill lane and a 128-row late tail. Off leaves the stock path unchanged.
  GR8_DS_PF_V2_GATE_RO:
    scope: local
    kind: flag
    default: "0"
    values: "0|1"
    doc: >-
      V2 FFN own-row gate only: use the existing read-once register-tile gate
      for 384 experts. Default 0 retains k_gate_logits_mt; other expert counts
      retain that kernel. Independent of GR8_DS_GATE_RO. Logs on/off once per
      request per rank; shared-memory opt-in is set at scratch initialization.
  GR8_DS_PF_V2_RS_BLOCKS:
    scope: local
    kind: ints
    default: "48"
    doc: >-
      V2 FFN reduce-scatter only. The default, 48, runs the reduce with 48 blocks;
      0 selects the eight-block scalar reduce kernel.
      Otherwise a comma list of positive block counts (e.g. 48,192,1024);
      request ID r selects list[r % length], logged once per request per rank.
      Uses aligned 16-byte cache-volatile loads and 16-byte stores with a scalar tail,
      preserving the original FP32 rank summation order. Mixed zero/nonzero lists
      are invalid. Boot gathers and non-v2 paths are unchanged.
  GR8_DS_PF_V2_PACK_BLOCKS:
    scope: local
    kind: ints
    default: "48"
    doc: >-
      V2 wire pack/unpack only (AG, A2A and RS). The default, 48, packs with 48 blocks;
      0 selects the old eight blocks.
      Otherwise a comma list of positive block counts (e.g. 48,192,1024);
      request ID r selects list[r % length], logged once per request per rank.
      Retains the existing aligned 16-byte copies and scalar ragged/unaligned
      fallback, without changing kernels. Mixed zero/nonzero lists are invalid.
      Boot gathers retain eight blocks. Independent of GR8_DS_PF_V2_RS_BLOCKS.
  GR8_DS_PF_V2_STRIPE_MIN:
    scope: agree
    kind: int
    default: "0"
    values: "0.."
    doc: >-
      Dedicated v2 fabric only: positive N sets the dual-rail payload striping
      threshold in bytes. The existing proxy keeps its 8192-byte floor, so the
      effective threshold is max(N, 8192); the first half is rounded down to
      4096 bytes. Needs two mesh rails (--ips2) to stripe; one rail or a TP4
      ring keeps the existing transport. Logs min, rails and effective_min once
      per boot per rank. 0 leaves the inherited fabric configuration unchanged
      (normally no striping; an existing GR8_DS_STRIPE setting is preserved).
      No effect when GR8_DS_PF_V2=0. Wire bytes and tail ordering are unchanged.
  GR8_DS_PF_V2_XTRACE:
    scope: local
    kind: flag
    default: "0"
    values: "0|1"
    doc: >-
      With GR8_XTRACE=1 and GR8_DS_PF_V2=1, trace the dedicated v2 fabric,
      independently of GR8_XTRACE_PF. GPU producer, publish, peer-tail,
      consume and join stamps accompany the existing proxy doorbell/post stamps.
      Also enables v2 per-chunk timing and epoch/request/layer correlation on stderr,
      with layer/attention/Engram/dispatch/FC1/FC2/combine/assemble boundaries and
      separate pack-publication, peer wait, unpack and reduce event intervals.
      Uses GR8_XTRACE_OUT/QUIT; retains the last 64 fabric epochs (one per v2
      layer, including boot gathers), not a complete long request. Default 0
      leaves v2's kernels, launches and timing setting unchanged.
  GR8_DS_PF_V2_TIMING:
    scope: local
    kind: flag
    default: "0"
    values: "0|1"
    doc: >-
      With GR8_DS_PF_V2=1, record per-layer compute/communication CUDA-event pairs
      into a bounded ring and print per chunk at the existing completion fence.
      Reports request id and chunk first-token offset, with intervals relative to
      that chunk's start to expose stream overlap. Retires each chunk's samples so
      long requests can reuse the ring without accumulating events.
      Never synchronizes the GPU; not-ready or overflow samples are labelled.
      Default 0 allocates no timing events and leaves the stock path unchanged.
  GR8_DS_PF_V2_FC2:
    scope: agree
    kind: flag
    default: "0"
    values: "0|1"
    doc: >-
      With GR8_DS_PF_V2=1, use the experimental resident-weight routed-expert down kernel:
      each CTA holds one 128-column weight slab across all bucketed rows, with heavy experts first.
      Default 0 retains the grouped stock tensor-core kernel. Has no effect when V2 is off.

  GR8_DS_PF_DIRECT:
    scope: agree
    kind: flag
    default: "0"
    values: "0|1"
    doc: >-
      On a W-row prefill chunk the attention output and the MoE combine write their collective's send slot in place;
      reduce-scatter slices go as flat slices. Needs GR8_DS_PREFILL_W above MX.
  GR8_DS_PF_GATHER:
    scope: agree
    kind: flag
    default: "0"
    values: "0|1"
    doc: >-
      Prefill consumes above MX rows read one device BF16 sum of the peers' partials instead of the peers' slots.
  GR8_DS_PF_LANES:
    scope: agree
    kind: text
    unset: "1, one lane"
    doc: >-
      1 or 2. 2 runs W-row prefill quanta of up to 2W rows of one session on two lanes with their own streams and fabric.
  GR8_DS_PF_LATE_FINAL:
    scope: agree
    kind: flag
    default: "0"
    values: "0|1"
    doc: >-
      With GR8_DS_PF_TAIL, a chunk with at least tail + window rows after it skips the late layers' rows that no later
      reader needs.
  GR8_DS_PF_L20_TAIL:
    scope: agree
    kind: flag
    default: "0"
    values: "0|1"
    doc: >-
      With GR8_DS_PF_TAIL, layer 20 joins the late layers: its compressed-KV row runs on every row of a chunk, the rest
      of the layer only on the tail rows.
  GR8_DS_PF_POOL:
    scope: agree
    kind: text
    unset: "off"
    doc: >-
      0, or 2..the run-0 collectives: the prefill fabric's layer exchanges and all-gathers reuse this many slots each
      (FabricConfig::pool).
  GR8_DS_PF_RS:
    scope: agree
    kind: flag
    default: "0"
    values: "0|1"
    doc: >-
      W-row prefill: the layer exchanges before the late split run as reduce-scatter plus all-gather. Needs
      GR8_DS_PF_TAIL and GR8_DS_PREFILL_W above MX.
  GR8_DS_PF_TAIL:
    scope: agree
    kind: text
    unset: "the model's tail rows"
    doc: >-
      Rows of each prefill chunk that run the late layers (bounded replay): 0 (off) or the attention window..4096.
  GR8_DS_PREFILL_KEEP:
    scope: agree
    kind: text
    unset: "0, every prompt row"
    doc: >-
      0, or 128 and more: only the last N prompt positions enter the DSpark draft's key rings.
  GR8_DS_PREFILL_MIN:
    scope: agree
    kind: int
    default: "0"
    values: "0.."
    doc: >-
      Prompts of at least this many tokens prefill in W-row chunks (GR8_DS_PREFILL_W); shorter ones, and every prompt at
      0, run as decode steps. Several sessions (--s2-sessions > 1) need 2 or more.
  GR8_DS_PREFILL_W:
    scope: agree
    kind: text
    unset: "MX: no W-row prefill"
    doc: >-
      Rows of one prefill chunk, MX..4096. GR8_DS_ATTN_PW and GR8_DS41_IDX_PW must name the same width.
  GR8_DS_RELAXED_ACCEPT:
    scope: agree
    kind: text
    unset: "off: exact acceptance"
    doc: >-
      DSpark verify accepts a greedy row's draft by a relaxed rule: ratio:R (0 < R <= 1) and / or topp:P (0 < P < 1),
      comma separated. Not exact.
  GR8_DS_SESS_DRAFTS:
    scope: agree
    kind: flag
    default: "0"
    values: "0|1"
    doc: >-
      DS41 DSpark serve: the drafts a session verifies in a decode round go by the sessions active in it, the most that
      keep every session's verify rows within the step's row cap (min(GR8_DS_MTP, max_rows / sessions - 1)), and a draft
      step of more than 6 sessions runs as launches of at most 6. At GR8_DS_MTP=5 and 32 rows: 1-5 active: 5 drafts (6
      rows a session, the same as with the knob off); 6: 4; 7-8: 3; 9-10: 2; 11-16: 1; above 16: none. Lower GR8_DS_MTP
      values use the same row-budget rule: 1-5 active sessions draft as with the knob off, drafts are first cut at 7
      (GR8_DS_MTP=4), 9 (3), 11 (2) or 17 (1) active, and drafting goes on up to 16 active sessions. 0: today's drafting
      limits (no drafts above 6 active sessions, above 5 at GR8_DS_MTP=5). Needs --serve and GR8_DS_MTP 1..5;
      --s2-sessions 1..32.
  GR8_DS_SPAN:
    scope: local
    kind: int
    default: "0"
    values: "0..2"
    doc: >-
      Prints the GPU time of each plan unit (attention, consume, MoE, head, ...) summed over the layers: every eager step,
      and for a captured step graph the mean per step over 16 sampled replays (every 16th replay is read, through
      globaltimer stamps the capture adds around each unit). 2: also one line per unit kind with the time of each layer.
  GR8_DS_STRIPE:
    scope: agree
    kind: flag
    default: "0"
    values: "0|1"
    doc: >-
      The main fabric stripes writes of at least GR8_DS_STRIPE_MIN bytes over both rails (needs --ips2).
  GR8_DS_STRIPE_MIN:
    scope: agree
    kind: int
    default: "1048576"
    values: "8192.."
    doc: >-
      With GR8_DS_STRIPE=1, the smallest write the fabric stripes, in bytes.
  GR8_DS_SUBDUMP:
    scope: local
    kind: path
    unset: "off"
    doc: >-
      Debug: a directory where each step's sub-layer partials are written.
  GR8_DS_VERIFY_CAP:
    scope: agree
    kind: text
    unset: "0, every draft is verified"
    doc: >-
      0, or a confidence threshold in (0, 1]: a DSpark draft whose confidence (GR8_DS_CONF_TEMP) is below it is not
      verified, so a round's verify step holds fewer rows. Exact: the emitted tokens do not change. Checked at boot;
      the verify step does not apply it yet.
  GR8_DS_WAIT_K:
    scope: agree
    kind: int
    default: "0"
    values: "0..2"
    doc: >-
      Who waits for the peers' tails before a consume kernel: 0 every CTA, 1 one wait kernel ahead of it, 2 one CTA that
      then releases the others through a device word (main model only; others fall back to 1).
  GR8_DS_XTRACE:
    scope: local
    kind: flag
    default: "0"
    values: "0|1"
    legacy: ["G6_XTRACE_DS"]
    doc: >-
      With GR8_XTRACE=1 and DSpark, also trace the DSpark draft fabric.
  GR8_DS41_PUB16:
    scope: agree
    kind: flag
    default: "0"
    doc: >-
      1 = a publish of 8 rows or fewer (the layer exchanges and the Engram reduce) copies into the send slot with 16
      CTAs instead of 1, the grid a publish of more rows already runs. The same bytes and the same doorbell, so the
      outputs do not change.
  GR8_DS41_HEAD_MX:
    scope: agree
    kind: flag
    default: "0"
    doc: >-
      1 = the loader builds the decode head from the release's BF16 rows as MXFP8 records (G.lm_head.mx.gv, rounded to
      nearest) in place of the BF16 GEMV records, so the head GEMV of a decode step reads a little over half the
      bytes. Not exact: the logits round differently, and outputs can change.
  GR8_DS41_VISION:
    scope: agree
    kind: flag
    default: "0"
    values: "0|1"
    doc: >-
      1 = with --serve, a release that has dense/exlr8-extra-vision.safetensors loads the vision tower at boot, before
      the KV pool is sized, and the engine takes requests with images (hello `vision`). Without that file the engine
      serves text only. 0 (the default) never loads the tower: the engine runs as it did before image input. The
      tower costs about 1.5 GB of device memory a rank, so image input is opt-in.
