# Variables gr8 reads under their own names. knobs/README.md describes the fields.
prefix: ""
knobs:
  TMPDIR:
    scope: local
    kind: path
    default: "/tmp"
    legacy: []
    doc: >-
      Where the loader writes its planned rank manifests.
  DISPRAM_DISABLE:
    scope: local
    kind: flag
    default: "0"
    legacy: []
    doc: >-
      Standard Kindling OS opt-out: 1 disables dispramd probes and leases in both the launcher and the engine.
  DISPRAM_SOCKET:
    scope: local
    kind: path
    default: "/run/dispram/dispram.sock"
    legacy: []
    doc: >-
      Unix domain SOCK_SEQPACKET socket path of the display-memory lender GR8_DISPRAM leases from: Kindling OS
      dispramd (the default), or on stock DGX OS spark-attic's atticd (github.com/bertholomus/spark-attic,
      /run/spark-attic/attic.sock, with DISPRAM_KEY_FILE). The engine trusts the lender behind this path, so the
      socket must be owned by root and writable only by root and the serving group (atticd's default is mode 0660).
      A lease is held until the engine frees its KV bindings or exits.
  DISPRAM_KEY_FILE:
    scope: local
    kind: path
    unset: "Kindling OS dispramd's own key"
    legacy: []
    doc: >-
      File holding the key that every dispram request carries, its surrounding whitespace trimmed (1 to 127
      printable bytes, no space, quote or backslash; read at most 4 KiB). Unset: Kindling OS dispramd's own key. On
      stock DGX OS with spark-attic's atticd, set /etc/spark-attic/key. A file that cannot be read or holds no valid
      key leases nothing, after one line saying why.
